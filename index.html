      <span style="flex:1"></span>${canDel?`<button class="btn small danger noprint" onclick="delReview('${r.id}')">удалить</button>`:""}</h4>
    <div class="fieldrow"><span>Ошибка (акт)</span><div>${inp(r,"error","",true)}<div style="max-width:340px;margin-top:6px">${ownerSelectReview(r)}</div></div></div>

    <div class="two-col">
      <div class="col left">
        <div class="col-h"><span class="colnum">1</span>Где сломалось · что за ошибка</div>

    <div class="verdict-zone">
      <div class="col-h" style="margin-bottom:8px;color:#4A7A3A"><span class="colnum" style="background:var(--green)">3</span>Системные причины этого разбора</div>
      ${reviewCauses(r).length? reviewCauses(r).map((c,i)=>causeRow(r,c,i)).join("") : `<div class="hint" style="margin-bottom:8px">Причин пока нет. Причина = несработавший барьер, за который отвечает кто-то в организации. Одна ошибка может дать несколько причин.</div>`}

function factorCard(r,f){

function barrierCard(r,b){

function barriersBlock(r){

function factorBarrierName(f){

/* ===== ШАГ 4: ОБСТОЯТЕЛЬСТВА (вопрос о влиянии) ===== */
function circRow(c,i){
  const v=c.verdict||(c.verdict={});
  let body="";
  if(c.influence===undefined||c.influence===""){
    body=`<div class="sdk-node"><div class="sdk-q">Имеет ли компания влияние на это обстоятельство (сейчас или в будущем)?</div>
      <div class="sdk-opts">

  } else if(c.influence==="no"){
    v.kind="stop";
    body=`<div class="hint" style="margin-top:6px">Влияния нет → остальные поля бесполезны. Итог: <b>непредотвратимое, стоп</b> (законно). <span class="noprint"><a href="#" onclick="setInfl(${i},'');return false">изменить</a></span></div>`;
  } else {
    v.kind="cause";
    c.causes=c.causes||[];
    body=`<div style="margin-top:8px"><label>Несработавший барьер (должен был предотвратить или нейтрализовать)</label>${inp(c,"barrier","«нет весового контроля на выезде»")}
        <div class="grid2" style="margin-top:6px">
          <div><label>Владелец (роль)</label>${ownerSelect(c)}</div>
          <div><label>Состояние барьера</label>${sel(c,"bstate",BSTATES)}</div>
        </div></div>
      <div class="causebox" style="margin-top:8px"><b>Системная причина:</b> ${inp(v,"text","«маршрут назначается без учёта фактической массы и профиля»")}
        <div style="max-width:230px;margin-top:6px"><label>Категория</label>${sel(v,"cat",CATS)}</div></div>
      ${c.causes.map((x,xi)=>`<div class="causebox" style="margin-top:6px">
          <div style="display:flex;gap:8px"><div style="flex:1"><b>Ещё причина:</b> ${inp(x,"text","формулировка")}</div>
          ${LOCKED()?"":`<button class="btn small danger noprint" style="align-self:flex-start" onclick="S.circs[${i}].causes.splice(${xi},1);save();render()">✕</button>`}</div>
          <div style="max-width:230px;margin-top:6px"><label>Категория</label>${sel(x,"cat",CATS)}</div></div>`).join("")}
      ${LOCKED()?"":`<button class="btn small sec noprint" style="margin-top:6px" onclick="S.circs[${i}].causes.push({id:uid(),text:'',cat:''});save();render()">+ ещё системная причина</button>`}`;
  }
  return `<div class="card" style="border-left:5px solid var(--blue)">
    <div style="display:flex;gap:10px"><div style="flex:1">
      <div class="fieldrow"><span>Обстоятельство</span><div>${inp(c,"text","",true)}</div></div>${body}
    </div><button class="btn small danger noprint" style="align-self:flex-start" onclick="S.circs.splice(${i},1);save();render()">✕</button></div></div>`;
}
function setInfl(i,val){const c=S.circs[i];c.influence=val;
  if(val==="no")c.verdict={kind:"stop"};
  else if(val==="yes"){c.verdict={kind:"cause",text:c.verdict&&c.verdict.text||"",cat:c.verdict&&c.verdict.cat||""};}
  else {c.verdict={};}
  save();render();}
function pullCircs(){
  const have=new Set(S.circs.map(c=>(c.text||"").trim().toLowerCase()));
  for(const L of S.links){
    for(const c of (L.circs||[])){
      if(c.kind==="prev")continue; // события пред. звена не идут в шаг 4 — они разбираются своим звеном
      const t=(c.text||"").trim(); if(!t||have.has(t.toLowerCase()))continue;
      S.circs.push({id:uid(),text:t,influence:"",barrier:"",owner:"",ownerOther:"",bstate:"",causes:[],verdict:{}});
      have.add(t.toLowerCase());
    }
  }
  save();render();}
function screen4(){
  return `<h2>Шаг 4 · Обстоятельства</h2>
  <div class="sub">Первый вопрос — <b>имеет ли компания влияние</b>. Нет — «непредотвратимое, стоп». Да — назовите несработавший барьер, его владельца и состояние, затем сформулируйте системные причины (их может быть несколько).</div>
  ${LOCKED()?"":`<div class="noprint" style="margin-bottom:10px">
    <button class="btn sec" onclick="pullCircs()">Подтянуть из звеньев</button>
    <button class="btn sec" onclick="S.circs.push({id:uid(),text:'',influence:'',barrier:'',owner:'',ownerOther:'',bstate:'',causes:[],verdict:{}});save();render()">+ Вручную</button></div>`}
  ${S.circs.length?S.circs.map(circRow).join(""):`<div class="empty">Обстоятельств нет — подтяните из звеньев.</div>`}`;
}
/* ===== ПРИЧИНЫ (порядок, дубли, мероприятия-дети) ===== */
function roleOf(r){return r.owner==="другое (указать)"?(r.ownerOther||"другое"):(r.owner||"");}
function causes(){
  const out=[];
  for(const r of S.reviews) for(const c of (r.causes||[]))
    out.push({id:c.id,kind:"review",obj:c,text:c.text||"",role:roleOf(c)||roleOf(r),type:r.type||"",src:"разбор: "+(r.error||"").slice(0,45)});
  for(const c of S.circs) if(c.verdict&&c.verdict.kind==="cause"){
    out.push({id:c.id,kind:"circ",obj:c.verdict,text:c.verdict.text||"",role:roleOf(c),type:"",src:"обстоятельство: "+(c.text||"").slice(0,50)});
    for(const x of (c.causes||[]))
      out.push({id:x.id,kind:"circ",obj:x,text:x.text||"",role:roleOf(c),type:"",src:"обстоятельство: "+(c.text||"").slice(0,50)});
  }
  out.forEach(c=>{const m=S.causeMeta[c.id]||{};c.dup=!!m.dup;c.needStats=!!m.needStats;});
  const ord=S.causeOrder||[];
  out.sort((a,b)=>{
    const ia=ord.indexOf(a.id), ib=ord.indexOf(b.id);
    return (ia<0?1e9:ia)-(ib<0?1e9:ib);
  });
  return out;
}
function moveCause(id,d){
  const ids=causes().map(c=>c.id);
  const i=ids.indexOf(id), j=i+d;
  if(i<0||j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  S.causeOrder=ids; save(); render();
}
function toggleDup(id){S.causeMeta[id]=S.causeMeta[id]||{};S.causeMeta[id].dup=!S.causeMeta[id].dup;save();render();}
function toggleNeedStats(id){S.causeMeta[id]=S.causeMeta[id]||{};S.causeMeta[id].needStats=!S.causeMeta[id].needStats;save();render();}

/* мероприятия причины (шаг 5: только текст) */
function actsOf(causeId){S.acts=S.acts||[];return S.acts.filter(a=>a.causeId===causeId);}
function addAct(causeId){S.acts=S.acts||[];S.acts.push({id:uid(),causeId,text:"",who:"",due:"",status:"",dup:false});save();render();}
function delAct(id){S.acts=(S.acts||[]).filter(a=>a.id!==id);save();render();}
function toggleActDup(id){const a=(S.acts||[]).find(x=>x.id===id);if(a){a.dup=!a.dup;save();render();}}

function screen5(){
  const cs=causes(); let n=0;

        <span style="color:var(--mut);font-size:12px">↳</span>
        <div style="flex:1">${inp(a,"text","мероприятие, закрывающее причину")}</div>

      </div>`).join("");
    return `<div class="causeItem ${c.dup?"dup":""}">
      <div class="rowbtns noprint"><button onclick="moveCause('${c.id}',-1)">▲</button><button onclick="moveCause('${c.id}',1)">▼</button></div>
      <span class="num">${idx}</span>
      <div style="flex:1">
        <div>${inp(c.obj,"text","формулировка причины (можно склеить из нескольких)")}</div>
        <div class="klist" style="margin-top:4px">из: ${esc(c.src)} · уровень: ${LEVEL(c.role)}${c.type?" · тип: "+esc(c.type):""}</div>
        <div style="margin-top:6px" class="noprint">
          <button class="btn small sec" onclick="toggleDup('${c.id}')">${c.dup?"вернуть (не дубль)":"пометить дублем"}</button>
          <span style="max-width:230px;display:inline-block;vertical-align:middle;margin-left:8px">${sel(c.obj,"cat",CATS)}</span>
        </div>
        ${c.dup?"":`<div style="margin-top:10px;padding:9px 11px;background:#FBFCFD;border:1px solid var(--line);border-radius:8px">
          <div style="display:flex;align-items:baseline;gap:10px">
            <b style="font-size:12.5px;color:var(--mut)">Мероприятия, закрывающие причину</b>

          </div>

            :(actRows||`<div class="hint" style="margin-top:4px">Пока нет — добавьте кнопкой; исполнителя и срок допишете на шаге 6.</div>`)}
          ${(meta.needStats||LOCKED())?"":`<button class="btn small coral noprint" style="margin-top:7px" onclick="addAct('${c.id}')">+ Мероприятие</button>`}
        </div>`}
      </div></div>`;
  }).join("");
  return `<h2>Шаг 5 · Системные причины</h2>
  <div class="sub">Собраны из разборов и обстоятельств; порядок — стрелками. Под каждой причиной — мероприятия, которые её закрывают (пока только формулировки; исполнитель, срок и статус — на шаге 6). Если мероприятие сейчас придумать невозможно — отметьте «копим статистику».</div>
  ${cs.length?rows:`<div class="empty">Причин пока нет. Появятся из разборов (шаг 3) и обстоятельств (шаг 4). Ноль причин при всех «стоп» — законный итог (непредотвратимое).</div>`}`;
}

/* ===== ШАГ 6: МЕРОПРИЯТИЯ (исполнитель, срок, статус, сортировка) ===== */
function classForCause(c){ if(c.type&&CLASS_BY_TYPE[c.type])return CLASS_BY_TYPE[c.type]; return ""; }
function moveAction(id,d){
  const disp=displayActs();
  const ids=disp.map(x=>x.a.id);
  if(S.actionSort&&S.actionSort.col){S.actionSort=null;}
  const i=ids.indexOf(id), j=i+d;
  if(i<0||j<0||j>=ids.length){S.actionOrder=ids;save();render();return;}
  [ids[i],ids[j]]=[ids[j],ids[i]];
  S.actionOrder=ids; save(); render();
}
function sortActions(col){
  const s0=S.actionSort;
  if(s0&&s0.col===col){ S.actionSort = s0.dir>0? {col,dir:-1} : null; }
  else S.actionSort={col,dir:1};
  save(); render();
}
function displayActs(){ // [{a,causeLabel}] в отображаемом порядке
  S.acts=S.acts||[];
  const cs=causes().filter(c=>!c.dup);
  const label={}; cs.forEach(c=>label[c.id]="Причина "+(cs.indexOf(c)+1)+": "+(c.text||"—").slice(0,50));
  const rows=S.acts.filter(a=>a.causeId===null||label[a.causeId]!==undefined||a.causeId==="")
    .map(a=>({a,causeLabel:a.causeId?(label[a.causeId]||"Причина (дубль/удалена)"):"Дополнительно (без причины)"}));
  const aord=S.actionOrder||[];
  rows.sort((x,y)=>{const ia=aord.indexOf(x.a.id),ib=aord.indexOf(y.a.id);return (ia<0?1e9:ia)-(ib<0?1e9:ib);});
  const srt=S.actionSort;
  if(srt&&srt.col){
    const val=r=> srt.col==="label"?r.causeLabel:String(r.a[srt.col]||"");
    rows.sort((x,y)=>val(x).localeCompare(val(y),"ru")*srt.dir);
  }
  return rows;
}
function actStatusClass(st){ return st==="выполнено"?"st-done":(st==="в процессе"?"st-prog":"st-none"); }
function screen7(){
  const disp=displayActs();
  const rows=disp.map(({a,causeLabel})=>`<tr class="${a.dup?"":actStatusClass(a.status)}" style="${a.dup?"opacity:.5":""}">
    <td style="width:210px">${esc(causeLabel)}</td>
    <td>${inp(a,"text","что сделать (SMART)")}</td>
    <td style="width:150px">${sel(a,"who",ROLES)}</td>
    <td style="width:90px">${inp(a,"due","срок")}</td>
    <td style="width:120px">${sel(a,"status",ACT_STATUS,()=>render(),true)}</td>
    <td style="width:70px"><div style="display:flex;gap:2px">
      <div class="rowbtns noprint"><button onclick="moveAction('${a.id}',-1)">▲</button><button onclick="moveAction('${a.id}',1)">▼</button></div>
      <button class="btn small sec noprint" title="дубль" onclick="toggleActDup('${a.id}')">${a.dup?"⟲":"дуб"}</button>
      ${a.causeId?"":`<button class="btn small danger noprint" onclick="delAct('${a.id}')">✕</button>`}
    </div></td></tr>`).join("");
  const th=[["label","К чему"],["text","Мероприятие"],["who","Исполнитель (роль)"],["due","Срок"],["status","Статус"]].map(h=>{
    const on=S.actionSort&&S.actionSort.col===h[0];
    return `<th style="cursor:pointer" onclick="sortActions('${h[0]}')" title="сортировать">${h[1]} ${on?(S.actionSort.dir>0?"▲":"▼"):"↕"}</th>`;
  }).join("");
  return `<h2>Шаг 6 · Корректирующие мероприятия (SMART)</h2>
  <div class="sub">Мероприятия заведены на шаге 5 под причинами; здесь дописываются исполнитель, срок и статус (не выполнено / в процессе / выполнено — строки подсвечены). Сортировка — кликом по заголовку, порядок — стрелками.</div>
  ${disp.length?`<div class="card"><table class="t"><tr>${th}<th></th></tr>${rows}</table>
    <div class="noprint" style="margin-top:10px"><button class="btn sec" onclick="S.acts.push({id:uid(),causeId:null,text:'',who:'',due:'',status:'',dup:false});save();render()">+ Мероприятие без привязки к причине</button></div></div>`
  :`<div class="empty">Мероприятий нет — добавьте их под причинами на шаге 5.</div>
    <div class="noprint" style="margin-top:10px"><button class="btn sec" onclick="S.acts=S.acts||[];S.acts.push({id:uid(),causeId:null,text:'',who:'',due:'',status:'',dup:false});save();render()">+ Мероприятие без привязки к причине</button></div>`}`;
}

/* ===== ШАГ 7: ВЫВОДЫ ===== */
function closeChecks(){
  const cs=causes().filter(c=>!c.dup);
  const problems=[];
  const noCauseDeclared=cs.length===0 && S.circs.length>0 &&
    S.circs.every(c=>c.verdict&&c.verdict.kind==="stop");
  if(cs.length===0&&!noCauseDeclared)
    problems.push("Нет системных причин. Либо сформулируйте их, либо доведите все обстоятельства до вывода «влияния нет» — тогда происшествие закрывается как непредотвратимое.");
  cs.forEach((c,i)=>{
    if(!(c.text||"").trim()) problems.push(`Причина ${i+1}: не заполнена формулировка.`);
    if(!(c.obj&&c.obj.cat)) problems.push(`Причина ${i+1}: не выбрана категория.`);
    const acts=(S.acts||[]).filter(a=>a.causeId===c.id&&!a.dup&&(a.text||"").trim());
    if(!acts.length&&!c.needStats) problems.push(`Причина ${i+1}: нет мероприятий (или отметьте «копим статистику»).`);
  });
  (S.acts||[]).filter(a=>!a.dup&&(a.text||"").trim()).forEach((a,i)=>{
    if(!(a.who||"").trim()) problems.push(`Мероприятие «${(a.text||"").slice(0,32)}»: не указан исполнитель.`);
    if(!(a.due||"").trim()) problems.push(`Мероприятие «${(a.text||"").slice(0,32)}»: не указан срок.`);
    if(!(a.status||"").trim()) problems.push(`Мероприятие «${(a.text||"").slice(0,32)}»: не выбран статус.`);
  });
  return problems;
}
function closeCase2(){
  const p=closeChecks();
  if(p.length){ alert("Расследование не может быть закрыто:\n\n• "+p.join("\n• ")); return; }
  if(!confirm("Закрыть расследование и поместить в архив?\n\nПосле закрытия править можно будет только статусы мероприятий."))return;
  S.closed=true; S.closedAt=Date.now(); S.archived=true;
  save(); if(typeof logAction==="function")logAction("закрытие дела",S.id,S.name); render();
}
function reopenCase(){
  if(!confirm("Извлечь расследование из архива для правки?"))return;
  S.closed=false; S.archived=false; save(); if(typeof logAction==="function")logAction("извлечение из архива",S.id,S.name); render();
}
function screen8(){
  const cs=causes().filter(c=>!c.dup); const n=cs.length;
  const anyReviews=S.reviews.length+S.circs.length>0;

  const allClosed = anyReviews && n===0 && rvClosed &&
    S.circs.every(c=>c.verdict&&(c.verdict.kind==="stop"||(c.verdict.kind==="rec"&&c.verdict.reviewId)));
  const status=n>0?"ПРЕДОТВРАТИМОЕ":(allClosed?"НЕПРЕДОТВРАТИМОЕ (все ветви — стоп)":"— разбор не завершён");

  return `<h2>Шаг 7 · Выводы</h2>
  <div class="sub">Собирается автоматически. Для печати — кнопка «Печать отчёта» в шапке.</div>
  <div class="card">
    <label>Краткое описание происшествия</label>
    ${inp(S.info,"desc","что произошло — 2–3 фразы для вводной части акта",true)}
    <div class="hint" style="margin-top:4px">Это то же поле, что на шаге 0 «Регистрация»: правки здесь и там синхронны.</div>
  </div>
  <div class="card"><div class="grid2">
    <div><label>Происшествие</label><div style="font-weight:700;font-size:16px">${status}</div></div>
    <div><label>Системных причин</label><div style="font-weight:700;font-size:16px">${n}</div></div></div>
    <div style="margin-top:10px"><label>Распределение</label>водитель: <b>${dist["водитель"]}</b> · операторы: <b>${dist["операторы"]}</b> · руководство: <b>${dist["руководство"]}</b></div>
    ${n?`<div style="margin-top:10px"><label>Причины</label><ul style="padding-left:18px">${list}</ul></div>`:""}
  </div>
  <div class="card"><label>Особые мнения / примечания</label>${inp(S.concl,"notes","",true)}</div>
  ${S.closed
    ? `<div class="closedBar"><b>Расследование закрыто${S.closedAt?" · "+new Date(S.closedAt).toLocaleDateString("ru"):""}</b>
        <span class="hint" style="margin:0">В архиве правятся только статусы мероприятий.</span><span style="flex:1"></span>
        <button class="btn sec noprint" onclick="reopenCase()">Извлечь из архива</button></div>`
    : `<div class="card noprint" style="border-left:5px solid var(--green)">
        <b style="font-size:13px">Завершение расследования</b>
        <div class="hint" style="margin:5px 0 8px">Проверяются причины (формулировка, категория, мероприятия) и мероприятия (исполнитель, срок, статус). После закрытия дело уходит в архив и правкам не подлежит.</div>
        ${(()=>{const p=closeChecks();return p.length
          ? `<div class="warn" style="margin-bottom:8px">Не готово к закрытию:<ul style="margin:5px 0 0 16px">${p.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}${p.length>8?`<li>…и ещё ${p.length-8}</li>`:""}</ul></div>`
          : `<div class="hint" style="color:var(--green)">Все проверки пройдены.</div>`;})()}
        <button class="btn coral" onclick="closeCase2()">Закрыть расследование</button>
      </div>`}`;
}

const STEP_NAMES=["Регистрация","Факты","Хронология","Звенья цепи","Разбор ошибок","Обстоятельства","Причины","Мероприятия","Выводы"];

/* схема цепи → картинка (Word не понимает векторную графику страницы) */
async function schemePNG(){
  try{
    if(!S.links||!S.links.length) return "";
    const box=document.createElement("div");
    box.innerHTML=schemeSVG();
    const svg=box.querySelector("svg");
    if(!svg) return "";
    const w=parseInt(svg.getAttribute("width"),10)||900;
    const hh=parseInt(svg.getAttribute("height"),10)||400;
    const xml=new XMLSerializer().serializeToString(svg);
    const url="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)));
    const img=new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; setTimeout(rej,4000); });
    const k=2;
    const cv=document.createElement("canvas"); cv.width=w*k; cv.height=hh*k;
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.scale(k,k); ctx.drawImage(img,0,0);
    return cv.toDataURL("image/png");
  }catch(e){ return ""; }
}

function roleOfObj(o){ return o.owner==="другое (указать)"?(o.ownerOther||"другое"):(o.owner||""); }

function statErrors(){ // 1) ошибки по формуле: группировка по коду каталога (иначе по тексту)
  const m={};
  const add=(key,error,code,who,cname,type)=>{
    m[key]=m[key]||{error,code,who,types:new Set(),n:0,cases:new Set()};
    m[key].n++; m[key].cases.add(cname);
    if(type)m[key].types.add(type);
  };
  for(const c of statCases()){
    // тип из разбора подтянем к звену через reviewId
    const typeByReview={}; (c.reviews||[]).forEach(r=>{ if(r.type) typeByReview[r.id]=r.type+(r.subtype?" ("+r.subtype+")":""); });
    for(const L of (c.links||[])){
      if(L.pure||!(L.error||"").trim())continue;
      const who=L.who||"—";
      const code=L.errCode||"";
      const canonical=code&&errByCode(code)?errByCode(code).e:L.error.trim();
      add((code||L.error.trim().toLowerCase())+"§"+who, canonical, code, who, c.name, typeByReview[L.reviewId]);
    }
    for(const r of (c.reviews||[])){ // ручные разборы вне звеньев
      if(!(r.error||"").trim())continue;
      const linked=(c.links||[]).some(L=>L.reviewId===r.id);
      if(linked)continue;
      const who=roleOfObj(r)||"—";
      add(r.error.trim().toLowerCase()+"§"+who, r.error.trim(), "", who, c.name, r.type?(r.type+(r.subtype?" ("+r.subtype+")":"")):"");
    }
  }
  return Object.values(m).sort((a,b)=>b.n-a.n);
}
function statCandidates(){ // ошибки-кандидаты в каталог (без кода)
  const m={};
  for(const c of statCases()) for(const L of (c.links||[])){
    if(L.pure||!(L.error||"").trim()||L.errCode)continue;
    const k=L.error.trim().toLowerCase();
    m[k]=m[k]||{error:L.error.trim(),n:0,cases:new Set()};
    m[k].n++; m[k].cases.add(c.name);
  }
  return Object.values(m).sort((a,b)=>b.n-a.n);
}
function statCircs(){ // 2) обстоятельства
  const m={};
  for(const c of statCases()) for(const x of (c.circs||[])){
    if(!(x.text||"").trim())continue;
    const k=x.text.trim().toLowerCase();
    m[k]=m[k]||{text:x.text.trim(),n:0,cases:new Set(),infl:new Set()};
    m[k].n++; m[k].cases.add(c.name);
    if(x.influence==="yes")m[k].infl.add("влияние есть");
    if(x.influence==="no")m[k].infl.add("управы нет");
  }
  return Object.values(m).sort((a,b)=>b.n-a.n);
}
function allCauses(){ // 3) причины (по всем делам)
  const out=[];
  for(const c of statCases()){
    const meta=c.causeMeta||{};
    const nActs=id=>((c.acts||[]).filter(a=>a.causeId===id&&!a.dup&&(a.text||"").trim()).length);
    for(const r of (c.reviews||[])) for(const x of (r.causes||[])){
      if(meta[x.id]&&meta[x.id].dup)continue;
      out.push({case:c.name,caseId:c.id,id:x.id,text:x.text,role:roleOfObj(x)||roleOfObj(r),cat:x.cat||"",type:r.type||"",nActs:nActs(x.id),needStats:!!(meta[x.id]&&meta[x.id].needStats)});
    }
    for(const x of (c.circs||[])) if(x.verdict&&x.verdict.kind==="cause"){
      if(meta[x.id]&&meta[x.id].dup)continue;
      out.push({case:c.name,caseId:c.id,id:x.id,text:x.verdict.text||"",role:roleOfObj(x),cat:x.verdict.cat||"",type:"",nActs:nActs(x.id),needStats:!!(meta[x.id]&&meta[x.id].needStats)});
    }
  }
  return out;
}
function openFromStats(caseId,step){ statsView=0; openCase(caseId); goto(step); }
function setActStatusGlobal(caseId,actId,val){
  const c=DB.cases.find(x=>x.id===caseId); if(!c)return;
  const a=(c.acts||[]).find(x=>x.id===actId); if(!a)return;
  a.status=val; save(); render();
}
function statActions(){ // 4) мероприятия
  const out=[];
  for(const c of statCases()){
    const causeText={};
    for(const r of (c.reviews||[])) for(const x of (r.causes||[])) causeText[x.id]=x.text;
    for(const x of (c.circs||[])) if(x.verdict) causeText[x.id]=x.verdict.text;
    for(const a of (c.acts||[])){
      if(a.dup||!(a.text||"").trim())continue;
      out.push({case:c.name,caseId:c.id,actId:a.id,cause:a.causeId?(causeText[a.causeId]||"—"):"без причины",action:a.text,who:a.who||"",due:a.due||"",status:a.status||"не выполнено"});
    }
  }
  return out;
}
function statStages(){ // где ломается: этапы реакции по разборам
  const m={}; for(const c of statCases()) for(const r of (c.reviews||[])) if(r.stage) m[r.stage]=(m[r.stage]||0)+1;
  return ["восприятие","анализ","решение","действие"].filter(k=>m[k]).map(k=>[k,m[k]]);
}
function statModes(){ // режимы движения по звеньям (из каталога)
  const m={}; for(const c of statCases()) for(const L of (c.links||[])) if(L.catMode) m[L.catMode]=(m[L.catMode]||0)+1;
  return MODES.filter(k=>m[k]).map(k=>[k,m[k]]);
}
function statPrevent(){ // предотвратимость дел
  let prev=0,noprev=0,open=0;
  for(const c of statCases()){
    const meta=c.causeMeta||{};
    let n=0;
    for(const r of (c.reviews||[])) for(const x of (r.causes||[])) if(!(meta[x.id]&&meta[x.id].dup)) n++;
    for(const x of (c.circs||[])) if(x.verdict&&x.verdict.kind==="cause"&&!(meta[x.id]&&meta[x.id].dup)) n++;
    if(n>0){prev++;continue;}
    const anyR=(c.reviews||[]).length+(c.circs||[]).length>0;
    const rvClosed=(c.reviews||[]).every(r=>(r.causes&&r.causes.length>0)||(c.reviews||[]).some(k=>k.parent===r.id));
    const allClosed=anyR&&rvClosed&&(c.circs||[]).every(x=>x.verdict&&x.verdict.kind==="stop");
    if(allClosed)noprev++; else open++;
  }
  return {prev,noprev,open};
}
function statPairs(){ // пары «ошибка × обстоятельство» из звеньев — зародыш реестра соответствий
  const m={};
  for(const c of statCases()) for(const L of (c.links||[])){
    if(L.pure||!(L.error||"").trim())continue;
    const ename=(L.errCode&&errByCode(L.errCode))?errByCode(L.errCode).e:L.error.trim();
    for(const cc of (L.circs||[])){
      const p=(cc.text||"").trim(); if(!p)continue;
      m[ename+" × "+p]=(m[ename+" × "+p]||0)+1;
    }
  }
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,12);
}
function statInfoBy(key){
  const m={};
  for(const c of statCases()){const v=(c.info&&c.info[key]||"").trim();if(v)m[v]=(m[v]||0)+1;}
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
const MN=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function statByWeekday(){ // все 7 дней, кор. подписи
  const m={};let any=0;
  for(const c of statCases()){const w=weekdayOf(c.info&&c.info.dateISO);if(w){m[w]=(m[w]||0)+1;any++;}}
  if(!any)return [];
  const map={"понедельник":"пн","вторник":"вт","среда":"ср","четверг":"чт","пятница":"пт","суббота":"сб","воскресенье":"вс"};
  return ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"].map(w=>[map[w],m[w]||0]);
}
function statByHour(){ // все 24 часа
  const m={};let any=0;
  for(const c of statCases()){const t=(c.info&&c.info.time||"").match(/^(\d{2}):/);if(t){m[+t[1]]=(m[+t[1]]||0)+1;any++;}}
  if(!any)return [];
  return Array.from({length:24},(_,h)=>[String(h),m[h]||0]);
}
function statByMonthAll(){ // янв–дек, независимо от года
  const m={};let any=0;
  for(const c of statCases()){const d=(c.info&&c.info.dateISO||"").match(/^\d{4}-(\d{2})/);if(d){m[+d[1]]=(m[+d[1]]||0)+1;any++;}}
  if(!any)return [];
  return MN.map((n,i)=>[n,m[i+1]||0]);
}
function statLast12(){ // окно последних 12 месяцев
  const now=new Date(); const keys=[];
  for(let k=11;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);
    keys.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),lbl:MN[d.getMonth()]+" "+String(d.getFullYear()).slice(2)});}
  const m={};let any=0;
  for(const c of statCases()){const d=(c.info&&c.info.dateISO||"").match(/^(\d{4}-\d{2})/);if(d){m[d[1]]=(m[d[1]]||0)+1;any++;}}
  if(!any)return [];
  return keys.map(k=>[k.lbl,m[k.key]||0]);
}
function vbars(pairs,cls){ // вертикальные столбики
  if(!pairs.length)return "";
  const mx=Math.max(...pairs.map(p=>p[1]),1);
  return `<div class="vchart ${cls||""}">`+pairs.map(p=>`<div class="vcol">
      <div class="vval">${p[1]||""}</div>
      <div class="vbar" style="height:${p[1]?Math.max(Math.round(p[1]/mx*100),4):0}%"></div>
      <div class="vlbl">${esc(p[0])}</div></div>`).join("")+`</div>`;
}
const PIE_COLORS=["#4A79A8","#C4674A","#7FA65A","#D9A441","#8A6FA8","#5BA8A0","#A85B79","#8A96A3","#B08968","#6B7FA8","#A8A05B","#5B6B7C"];
function pieSVG(pairs){ // кольцевая диаграмма с легендой
  if(!pairs.length)return "";
  const total=pairs.reduce((a,p)=>a+p[1],0); if(!total)return "";
  const R=62,r0=34,cx=70,cy=70;
  let a0=-Math.PI/2, paths="";
  pairs.forEach((p,i)=>{
    const frac=p[1]/total, a1=a0+frac*2*Math.PI;
    const col=PIE_COLORS[i%PIE_COLORS.length];
    if(frac>=0.999){
      paths+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="${r0}" fill="#fff"/>`;
    } else {
      const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
      const xi=cx+r0*Math.cos(a1),yi=cy+r0*Math.sin(a1),xj=cx+r0*Math.cos(a0),yj=cy+r0*Math.sin(a0);
      const lg=(a1-a0)>Math.PI?1:0;
      paths+=`<path d="M${x0},${y0} A${R},${R} 0 ${lg} 1 ${x1},${y1} L${xi},${yi} A${r0},${r0} 0 ${lg} 0 ${xj},${yj} Z" fill="${col}"/>`;
    }
    a0=a1;
  });
  const legend=pairs.map((p,i)=>`<div><span class="sw" style="background:${PIE_COLORS[i%PIE_COLORS.length]}"></span>${esc(p[0])} — <b>${p[1]}</b> (${Math.round(p[1]/total*100)}%)</div>`).join("");
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <svg width="140" height="140" xmlns="http://www.w3.org/2000/svg">${paths}
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E2A38">${total}</text></svg>
    <div class="pieLegend">${legend}</div></div>`;
}
function hbars(pairs,cls){ // горизонтальный бар-график
  if(!pairs.length)return "";
  const mx=Math.max(...pairs.map(p=>p[1]));
  return pairs.map(p=>`<div class="hbar ${cls||""}"><div class="lbl" title="${esc(p[0])}">${esc(p[0])}</div><div class="track"><div class="fill" style="width:${Math.round(p[1]/mx*100)}%"></div></div><div class="val">${p[1]}</div></div>`).join("");
}
function countBy(arr,key){
  const m={}; arr.forEach(x=>{const k=x[key]||"— не указано"; m[k]=(m[k]||0)+1;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function csvEscape(v){ v=String(v??""); return /[";\n]/.test(v)?('"'+v.replace(/"/g,'""')+'"'):v; }
function downloadCSVRows(fname,rows){
  const csv='\ufeff'+rows.map(r=>r.map(csvEscape).join(";")).join("\n");
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  flash("CSV сформирован");
}

      return `<tr class="${cls}"><td>${esc(c.case)}</td><td>${esc(c.text)}</td><td>${esc(c.role)}</td><td>${esc(c.cat)}</td><td><b>${badge}</b></td><td><button class="btn small sec noprint" title="открыть расследование" onclick="openFromStats('${c.caseId}',5)">→</button></td></tr>`;
    }).join("")}</table>
    <div class="hint">Красным — причина без мероприятий; жёлтым — «копим статистику» (осознанный ноль). Кнопка → открывает расследование на шаге причин.</div>`
    :`<div class="empty">Причин пока нет.</div>`)}

  ${statBlock("4 · Корректирующие мероприятия","csvActions",
    acts.length?`
    <div class="hbar green" style="margin-bottom:8px"><div class="lbl">выполнено</div><div class="track"><div class="fill" style="width:${acts.length?Math.round(actDone/acts.length*100):0}%"></div></div><div class="val">${actDone}/${acts.length}</div></div>
    <table class="t"><tr><th>Расследование</th><th>Причина</th><th>Мероприятие</th><th>Исполнитель</th><th style="width:74px">Срок</th><th style="width:126px">Статус</th><th style="width:36px"></th></tr>
    ${acts.map(a=>`<tr class="${a.status==="выполнено"?"st-done":(a.status==="в процессе"?"st-prog":"st-none")}">
      <td>${esc(a.case)}</td><td>${esc((a.cause||"").slice(0,45))}</td><td>${esc(a.action)}</td><td>${esc(a.who)}</td><td>${esc(a.due)}</td>
      <td><select onchange="setActStatusGlobal('${a.caseId}','${a.actId}',this.value)">
        ${ACT_STATUS.map(st=>`<option ${((a.status||"не выполнено")===st)?"selected":""}>${st}</option>`).join("")}
      </select></td>
      <td><button class="btn small sec noprint" title="открыть расследование" onclick="openFromStats('${a.caseId}',6)">→</button></td></tr>`).join("")}</table>
    <div class="hint">Статус меняется прямо здесь (сохраняется в деле). Кнопка → открывает расследование на шаге мероприятий.</div>`
    :`<div class="empty">Мероприятий пока нет.</div>`)}`;
}
function statCases(){ return DB.cases.filter(c=>!c.is_sample); } // образцы в статистику не идут
/* ===== РЕЕСТР ПРОИСШЕСТВИЙ ===== */
let regQuery="", regSort={col:"date",dir:-1};
function regRows(){
  const q=regQuery.trim().toLowerCase();
  let rows=DB.cases.map(c=>{
    const st=caseStats(c); const i=c.info||{};
    return {c, num:i.num||"", date:i.dateISO||"", time:i.time||"", kind:i.kind||"",
      area:i.area||"", spot:i.spot||"", ts:i.ts||"", tsType:i.tsType||"", unit:i.unit||"",
      driver:i.driver||"", name:c.name||"", causes:st.causes, acts:st.acts, done:st.done,
      status:c.closed?"закрыто":(st.causes?"в работе":"черновик")};
  });
  if(q){
    rows=rows.filter(r=>[r.num,r.name,r.kind,r.area,r.spot,r.ts,r.tsType,r.unit,r.driver,
      isoToRu(r.date),r.status].join(" ").toLowerCase().includes(q));
  }
  const k=regSort.col, d=regSort.dir;
  rows.sort((a,b)=>{
    let va=a[k], vb=b[k];
    if(typeof va==="number"&&typeof vb==="number") return (va-vb)*d;
    return String(va||"").localeCompare(String(vb||""),"ru")*d;
  });
  return rows;
}
function regSortBy(col){
  if(regSort.col===col) regSort={col,dir:-regSort.dir};
  else regSort={col,dir:col==="date"?-1:1};
  render();
}
function setRegQuery(v){ regQuery=v; const t=document.getElementById("regTable"); if(t) t.innerHTML=regTableHTML(); }
function regTableHTML(){
  const rows=regRows();
  const cols=[["num","№",56],["date","Дата",92],["time","Время",62],["kind","Вид ДТП",150],
    ["area","Место происш.",140],["spot","Место ДТП",150],["tsType","Тип ТС",90],["unit","Подразделение",130],
    ["driver","Водитель",90],["causes","Причин",64],["acts","Мер",70],["status","Статус",90]];
  if(!rows.length) return `<div class="empty">${regQuery?"Ничего не найдено — измените запрос.":"Расследований пока нет."}</div>`;
  return `<table class="t"><tr>${cols.map(([k,l,w])=>{
      const on=regSort.col===k;
      return `<th style="width:${w}px;cursor:pointer" onclick="regSortBy('${k}')">${l} ${on?(regSort.dir>0?"▲":"▼"):"↕"}</th>`;
    }).join("")}</tr>
    ${rows.map(r=>`<tr class="regRow ${r.c.closed?"st-done":""}" onclick="openFromRegistry('${r.c.id}')">
      <td>${esc(r.num||"—")}</td><td>${esc(isoToRu(r.date)||"—")}</td><td>${esc(r.time||"")}</td>
      <td>${esc(r.kind||"—")}</td><td>${esc(r.area||"")}</td><td>${esc(r.spot||"")}</td>
      <td>${esc(r.tsType||"")}</td><td>${esc(r.unit||"")}</td><td>${esc(r.driver||"")}</td>
      <td><b>${r.causes}</b></td><td>${r.done}/${r.acts}</td>
      <td>${r.c.closed?`<span class="pill" style="background:var(--green-l);color:var(--green)">закрыто</span>`:esc(r.status)}</td>
    </tr>`).join("")}</table>
    <div class="hint" style="margin-top:6px">Показано ${rows.length} из ${DB.cases.length}. Щелчок по строке открывает расследование.</div>`;
}
function openFromRegistry(id){ statsView=0; openCase(id); }
function csvRegistry(){
  const rows=regRows();
  downloadCSVRows("reestr_dtp.csv",[
    ["№","Дата","Время","Вид ДТП","Место происшествия","Место ДТП","Тип ТС","ТС","Подразделение","Водитель","Название","Причин","Мероприятий","Выполнено","Статус"],
    ...rows.map(r=>[r.num,isoToRu(r.date),r.time,r.kind,r.area,r.spot,r.tsType,r.ts,r.unit,r.driver,r.name,r.causes,r.acts,r.done,r.status])]);
}
function screenRegistry(){
  return `
  <h2>Реестр происшествий</h2>
  <div class="sub">Все расследования таблицей. Поиск идёт по номеру, дате, виду ДТП, месту, ТС, подразделению, водителю и статусу; сортировка — щелчком по заголовку.</div>
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <input class="searchBox" type="text" placeholder="Поиск: «съезд», «АК-2», «14.05.2026», «закрыто»…" value="${esc(regQuery)}"
        oninput="setRegQuery(this.value)">
      ${regQuery?`<button class="btn small sec noprint" onclick="regQuery='';render()">сбросить</button>`:""}
      <span style="flex:1"></span>
      <button class="btn small sec noprint" onclick="csvRegistry()">Выгрузить CSV</button>
    </div>
    <div id="regTable">${regTableHTML()}</div>
  </div>`;
}

/* ===== ИНСТРУКЦИЯ ===== */
function guideBlock(n,title,body){

}
function screenGuide(){
  const ex=(t)=>`<div style="margin-top:8px;padding:9px 11px;background:var(--blue-l);border-radius:8px;font-size:13px"><b style="color:var(--blue)">Пример.</b> ${t}</div>`;
  const warn=(t)=>`<div class="warn" style="margin-top:8px">${t}</div>`;
  return `
  ${(typeof returnTo!=="undefined"&&returnTo)?`<div class="noprint" style="margin-bottom:10px"><button class="btn coral" onclick="backToCase()">← Вернуться к расследованию</button></div>`:""}
  <h2>Как пользоваться</h2>
  <div class="sub">Короткое руководство: сначала — принцип, на котором всё построено, затем восемь шагов расследования с примерами.</div>

  <div class="card" style="border-left:5px solid var(--coral)">
    <b style="font-size:15px">Принцип: ДТП = Ошибка × Обстоятельства</b>
    <p style="margin:8px 0 0">Происшествие никогда не возникает из одной причины. Оно рождается там, где <b>ошибка</b> — то есть действие или бездействие человека — встречается с <b>обстоятельствами</b>, в которых это действие даёт разрушительный результат. Одно без другого происшествия не даёт.</p>
    <p style="margin:8px 0 0">Знак умножения здесь не для красоты. Он означает: если один из сомножителей равен нулю, произведение — ноль. Нет ошибки — обстоятельства сами по себе безопасны. Нет обстоятельств — та же самая ошибка проходит без последствий, и водитель даже не замечает, что ошибся.</p>
    ${ex(`Водитель тормозит на дуге поворота. На сухом асфальте при умеренной скорости — ничего не произойдёт, ошибка останется незамеченной. Та же ошибка на обледеневшей дуге со спуском — занос и съезд. Ошибка одна, разница в обстоятельствах.`)}
    <p style="margin:10px 0 0">Отсюда следуют два правила, на которых держится вся работа в приложении:</p>
    <ul style="margin:6px 0 0 18px">
      <li><b>Искать надо оба сомножителя.</b> Ответ «виноват водитель» — это половина ответа, и притом бесполезная: обстоятельствами управляет организация, и именно там находятся меры.</li>
      <li><b>Происшествие — это цепь, а не точка.</b> Событие, ставшее результатом одного звена, само становится обстоятельством для следующего. Разматывая цепь назад, вы уходите от водителя к решениям, которые создали обстановку.</li>
    </ul>
    ${ex(`Перегруз (событие звена A) становится обстоятельством для звена B: штатное торможение на спуске не справляется — отказ тормозов. Отказ тормозов (событие B) становится обстоятельством для звена C — съезд с дороги.`)}
  </div>

  ${guideBlock(0,"Регистрация — паспорт происшествия",`
    <p>Заполняются дата и время, вид ДТП, место, тип транспортного средства, идентификатор водителя, стаж и возраст. Эти поля потом складываются в статистику: по ним видно, где и когда происшествия повторяются.</p>
    <p style="margin-top:8px">Здесь же — <b>состав комиссии</b> и <b>материалы расследования</b>: опросный лист, телематика, видео, дефектовка. Материалы задают доказательную базу: дальше в хронологию попадут только те факты, у которых есть источник.</p>
    ${warn(`Фамилии водителей не хранятся. Вместо ФИО указывается табельный или условный номер — «В-147». Кто это, знает только сама организация.`)}`)}

  ${guideBlock(1,"Хронология — что известно и откуда",`
    <p>Записывается всё, что удалось установить, с указанием источника. У каждой записи — <b>носитель</b>: водитель, автомобиль, дорога, среда, операторы (диспетчер, механик, грузчик) или прочее.</p>
    <p style="margin-top:8px">Две отметки решают судьбу записи. <b>«Факт»</b> ставится, если сведения подтверждены источником, а не мнением. <b>«В цепь»</b> — если без этого события происшествие не состоялось бы; такую отметку можно поставить только факту.</p>
    ${ex(`«14:32:07 · водитель · начал торможение · источник: телематика» — факт. «Думал, что успею проскочить» — не факт, это объяснение; оно остаётся в хронологии, но в цепь не идёт и в акте помечается как допущение.`)}
    <p style="margin-top:8px">Ниже таблицы — временная шкала. На ней видно, что происходило одновременно; масштаб увеличивается кнопками, если события плотно идут по секундам.</p>`)}

  ${guideBlock(2,"Звенья цепи — разложение на формулу",`
    <p>Каждое звено — это одно <b>событие</b>, одна <b>ошибка</b> и сколько угодно <b>обстоятельств</b>. Идти удобнее от финала назад: что случилось последним, что этому предшествовало.</p>
    <p style="margin-top:8px">Заполнять поля можно тремя способами, кнопки стоят прямо у каждого поля: <b>из отобранного</b> (факты, помеченные «в цепь»), <b>из хронологии</b> (любая запись) и <b>из каталога</b> — для ошибки. Выбранный текст попадает в поле и остаётся редактируемым: формулировка звена должна быть точной, а не пересказом протокола.</p>

    ${ex(`Звено B: событие «отказ тормозов», ошибка «только штатное торможение на затяжном спуске», обстоятельства — «затяжной спуск 8 %» (внешнее) и «перегруз» (событие звена A).`)}
    <p style="margin-top:8px">Кнопка <b>«Схема цепи»</b> рисует то же самое картинкой: ошибка и обстоятельства сходятся в событие, событие уходит в следующее звено. Схема попадает в акт.</p>`)}

  ${guideBlock(3,"Разбор ошибок — где сломалось и что вызвало",`
    <p>Экран разделён на две части. Слева — <b>где сломалось</b>: на каком этапе действия оператора произошёл сбой и какого он типа. Справа — <b>что вызвало</b>: факторы, которые к этому привели.</p>
    <p style="margin-top:8px">Оба действия нужны не сами по себе, а чтобы восстановить <b>контекст ошибки</b>. Именно контекст выводит на системную причину: без него разбор упирается в «был невнимателен».</p>
    <p style="margin-top:8px">К каждому фактору добавляются <b>барьеры</b> — то, что должно было не дать фактору превратиться в ошибку. У барьера указывается владелец (чья это зона ответственности) и состояние: отсутствовал, отказал, неадекватный, эффективный. Барьеров на одну ошибку может быть несколько.</p>
    ${ex(`Фактор «квалификация: знание» → барьер «программа подготовки к горным маршрутам», владелец — специалист по БДД, состояние — отсутствовал. Отсюда системная причина: «водители на горные маршруты допускаются без специальной подготовки».`)}`)}

  ${guideBlock(4,"Обстоятельства — где кончается ответственность",`
    <p>Сюда попадают все внешние обстоятельства из звеньев. По каждому задаётся один вопрос: <b>имела ли компания возможность на него повлиять</b>?</p>
    <p style="margin-top:8px">Нет — ставится «стоп», это непредотвратимая часть. Да — называется несработавший барьер, его владелец и состояние, и формулируется системная причина.</p>
    ${ex(`«Гроза» — влияния нет, стоп. «Затяжной спуск на маршруте» — влияние есть: маршрут назначается без учёта массы и профиля дороги; барьер — планирование рейсов, владелец — диспетчер.`)}
    ${warn(`Ноль причин — законный итог. Если все обстоятельства получили «стоп», происшествие признаётся непредотвратимым, и это честный вывод, а не незаконченная работа.`)}`)}

  ${guideBlock(5,"Причины и мероприятия",`
    <p>Все системные причины собираются в один список. Их можно переставлять, склеивать одинаковые (пометкой «дубль») и задавать категорию — по ней потом строится статистика.</p>
    <p style="margin-top:8px">Под каждой причиной заводятся <b>мероприятия, которые её закрывают</b> — пока только формулировки. Если мероприятие сейчас придумать невозможно, ставится отметка <b>«копим статистику»</b>: это осознанный ноль, а не забытая строка.</p>
    ${warn(`Причина без мероприятий и без такой отметки не даст закрыть расследование.`)}`)}

  ${guideBlock(6,"Мероприятия — исполнитель, срок, статус",`

    <p style="margin-top:8px">Статусы видны в общей статистике по всем расследованиям — там же их можно менять, не заходя в дело. Это рабочий инструмент контроля исполнения.</p>`)}

  ${guideBlock(7,"Выводы и закрытие",`
    <p>Приложение само подводит итог: предотвратимое происшествие или нет, сколько системных причин и как они распределились по уровням — водитель, операторы, руководство.</p>

    <b style="font-size:14px">Что дальше</b>
    <p style="margin-top:6px"><b>Акт.</b> Кнопки в шапке: «Печать отчёта» и «Скачать .doc» — оба формируют один и тот же документ со схемой цепи и таблицами.</p>

  </div>

  <div class="card">
    <b style="font-size:14px">Учебный образец</b>
    <p style="margin-top:6px">Разбор реального ДТП, пройденный от начала до конца, находится в разделе <b>«Методика расследования»</b> (кнопка на главном экране) — вместе с теорией, к которой он служит иллюстрацией.</p>
  </div>
  ${COPYRIGHT_NOTE}`;
}
