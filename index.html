<style>
:root{
  --bg:#F7F9FB;--panel:#FFFFFF;--ink:#1E2A38;--mut:#5B6B7C;--line:#E2E8EF;
  --blue:#4A79A8;--blue-l:#E3EDF6;--coral:#C4674A;--coral-l:#F8E7DF;
  --gold:#B8922A;--gold-l:#F7EFD6;--green:#5E8C4A;--green-l:#E4EFDC;
  --amber:#B07D2B;--amber-l:#F5EAD4;--gray-l:#EDF0F3;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.mono{font-family:"SF Mono",Consolas,monospace}
header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo-img{height:32px;width:auto;display:block;flex:none;margin-right:12px;cursor:pointer;opacity:.97;transition:opacity .15s}
.logo-img:hover{opacity:1}
.brand{font-weight:700}
header .brand small{display:block;font-weight:400;opacity:.72;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
header .caseName{opacity:.85;font-size:13px;border-left:1px solid rgba(255,255,255,.3);padding-left:14px}
#causeCounter{margin-left:auto;background:var(--green);padding:6px 14px;border-radius:20px;font-weight:700;font-size:14px;white-space:nowrap}
#causeCounter.zero{background:#54646F}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
header button:hover{background:rgba(255,255,255,.12)}
.layout{display:flex;min-height:calc(100vh - 56px)}
nav{width:220px;flex:0 0 220px;padding:16px 10px;border-right:1px solid var(--line);position:sticky;top:56px;align-self:flex-start;max-height:calc(100vh - 56px);overflow-y:auto}
nav .step{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mut);margin-bottom:2px}
nav .step:hover{background:#E4EAF0}
nav .step.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(20,40,60,.12);font-weight:600}
nav .step .n{font-family:monospace;font-size:12px;background:var(--gray-l);border-radius:6px;padding:2px 7px;margin-top:1px}
nav .step.active .n{background:var(--ink);color:#fff}
nav .step .badge{margin-left:auto;font-size:11px;background:var(--blue-l);color:var(--blue);border-radius:10px;padding:1px 8px;font-weight:700}
nav .back{color:var(--mut);font-size:13px;cursor:pointer;padding:8px 10px;border-radius:8px;margin-bottom:8px}
nav .back:hover{background:#E4EAF0}
main{flex:1;padding:20px 24px;max-width:1600px;min-width:0}
h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px;max-width:1000px}
.sub .f,.f{font-family:monospace;background:var(--gray-l);padding:1px 6px;border-radius:5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:36px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-weight:600;background:var(--ink);color:#fff}
.btn:hover{opacity:.92}.btn.sec{background:var(--gray-l);color:var(--ink)}.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{background:#fff;color:#A33;border:1px solid #DBB}.btn.coral{background:var(--coral)}
.warn{background:var(--gold-l);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 8px 8px 0;font-size:13px;color:#6B5510;margin-top:6px}
.tip{background:var(--green-l,#E4EFDC);border-left:3px solid var(--green,#5E8C4A);padding:7px 10px;border-radius:0 8px 8px 0;font-size:13px;color:#37502A;margin-top:6px}
.stepbox{background:#fff;border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.stephead{background:var(--ink);color:#fff;padding:9px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
.stephead .gi{flex:none;width:24px;height:24px;border-radius:6px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.slbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--blue);margin:10px 0 2px}
.slbl:first-child{margin-top:0}
.slbl.err{color:var(--coral)}.slbl.ok{color:var(--green,#5E8C4A)}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);font-style:italic;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);background:#FBFCFD}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--blue-l);text-align:left;padding:7px 8px;font-size:12px;color:#2E4A66;border:1px solid var(--line)}
table.t td{border:1px solid var(--line);padding:5px 7px;vertical-align:top}
.lane-В{background:var(--coral-l)}.lane-А{background:var(--blue-l)}.lane-Д{background:#EAF3EE}.lane-С{background:var(--gray-l)}.lane-О{background:var(--gold-l)}.lane-П{background:#EFEAF6}
.chip{display:inline-block;border:1px solid var(--line);border-radius:16px;padding:4px 11px;margin:3px 4px 0 0;cursor:pointer;font-size:13px;background:#fff;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.fam{font-size:11px;border:none;background:none;color:var(--mut);cursor:default;padding:4px 0 0;display:block;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.review{border:1px solid var(--line);border-left:5px solid var(--coral);border-radius:var(--r);background:var(--panel);padding:14px;margin-bottom:12px}
.review.cause{border-left-color:var(--green)}.review.stop{border-left-color:#9AA6B1;opacity:.94}
.review h4{font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.review h4 .who{font-size:12px;color:var(--mut);font-weight:400}.review h4 .from{font-size:11px;background:var(--gray-l);border-radius:6px;padding:2px 7px;color:var(--mut)}
.fieldrow{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:start;margin-bottom:9px}
.fieldrow>span{font-size:12px;color:var(--mut);font-weight:600;padding-top:8px}
.verdict{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.verdict button{border:1.5px solid;border-radius:8px;padding:7px 13px;font-size:13.5px;cursor:pointer;background:#fff;font-weight:600}
.verdict .v-rec{border-color:var(--coral);color:var(--coral)}.verdict .v-rec.on{background:var(--coral);color:#fff}
.verdict .v-cause{border-color:var(--green);color:var(--green)}.verdict .v-cause.on{background:var(--green);color:#fff}
.verdict .v-stop{border-color:#9AA6B1;color:#5B6B7C}.verdict .v-stop.on{background:#7A8894;color:#fff}
.causebox{background:var(--green-l);border-radius:8px;padding:9px 11px;margin-top:8px;font-size:14px}.causebox b{color:var(--green)}
.child{margin-left:24px;position:relative}.child::before{content:"";position:absolute;left:-15px;top:0;bottom:0;width:2px;background:var(--line)}
.causeItem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:var(--r);background:var(--panel);padding:12px;margin-bottom:10px}
.causeItem.dup{opacity:.55;border-left-color:#B9C2CC}
.causeItem .num{font-family:monospace;font-weight:700;background:var(--green-l);color:var(--green);border-radius:8px;padding:4px 9px}
.klist{font-size:12.5px;color:var(--mut)}
.saveflash{position:fixed;bottom:14px;right:16px;background:var(--ink);color:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none}
.saveflash.show{opacity:.92}
/* список расследований */
.caseGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.caseCard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;transition:box-shadow .15s}
.caseCard:hover{box-shadow:0 3px 12px rgba(20,40,60,.13)}
.caseCard h3{font-size:16px;margin-bottom:4px}
.caseCard .meta{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.caseCard .stat{display:inline-block;font-size:12px;background:var(--green-l);color:var(--green);border-radius:12px;padding:2px 10px;font-weight:700}
.caseCard .stat.z{background:var(--gray-l);color:var(--mut)}
.caseCard.arch{opacity:.6}
.newCase{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600;min-height:120px}
.newCase:hover{border-color:var(--blue);color:var(--blue)}
/* STEP-шкала */
.step-scale{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#FBFCFD;padding:10px}
.step-lane{display:flex;align-items:center;height:34px;border-bottom:1px dashed var(--line)}
.step-lane:last-child{border-bottom:none}
.step-lane .lname{flex:0 0 120px;font-size:12px;color:var(--mut);font-weight:600}
.step-track{position:relative;flex:1;height:100%;min-width:520px}
.modalWrap{position:fixed;inset:0;background:rgba(30,42,56,.45);display:flex;align-items:center;justify-content:center;z-index:9998}
.modalBox{background:#fff;border-radius:14px;padding:18px 20px;max-width:440px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.reqBadge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;background:var(--coral);color:#fff;border-radius:9px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.scaleTip{position:fixed;z-index:9999;display:none;max-width:220px;background:#1E2A38;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.25);pointer-events:none}
.step-dot{position:absolute;top:50%;transform:transl(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.step-bar{position:absolute;height:10px;border-radius:5px;background:var(--blue-l);border:1px solid var(--blue);box-sizing:border-box}
.step-bar.backdrop{height:6px;opacity:.5;border-style:dashed;background:repeating-linear-gradient(90deg,var(--blue-l),var(--blue-l) 6px,transparent 6px,transparent 12px)}
.step-dot.inchain{background:var(--coral);box-shadow:0 0 0 1px var(--coral)}
.step-dot.laneО,.step-bar.laneО{background:var(--gold-l);border-color:var(--gold)}
.step-dot.laneП,.step-bar.laneП{background:#EFEAF6;border-color:#8A6FA8}
.step-time{position:absolute;font-size:9px;color:var(--mut);white-space:nowrap;pointer-events:none;background:rgba(255,255,255,.88);padding:0 2px;border-radius:3px;z-index:2}
.step-dot,.step-bar{cursor:pointer}
.step-dot:hover,.step-bar:hover{outline:2px solid var(--ink);outline-offset:1px}
tr.hl td{background:var(--gold-l)!important;transition:background .1s}
.sdk-node{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FBFCFD;margin-top:8px}
.sdk-q{font-weight:600;margin-bottom:8px}
.sdk-opts{display:flex;gap:8px;flex-wrap:wrap}
.sdk-opts .opt{border:1.5px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;background:#fff;font-size:13.5px}
.sdk-opts .opt:hover{border-color:var(--blue)}
.sdk-result{background:var(--blue-l);border-radius:8px;padding:10px 12px;margin-top:8px}
.sdk-cond{background:#fff;border:1px dashed var(--gold);border-radius:8px;padding:9px 11px;margin-top:8px;font-size:13px}
.sdk-cond b{color:var(--amber)}
.pill{display:inline-block;background:var(--coral-l);color:var(--coral);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700;margin-left:6px}
.rowbtns{display:flex;flex-direction:column;gap:2px}
.rowbtns button{border:none;background:var(--gray-l);border-radius:5px;cursor:pointer;font-size:11px;padding:2px 6px;color:var(--mut)}
.rowbtns button:hover{background:var(--blue-l);color:var(--blue)}
.catalog-pop{position:relative}
.catalog-list{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto;background:#fff;margin-top:4px}
.catalog-list .stg{background:var(--gray-l);font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);padding:4px 9px;position:sticky;top:0}
.catalog-list .it{padding:7px 9px;cursor:pointer;border-top:1px solid var(--line);font-size:13px}
.catalog-list .it:hover{background:var(--blue-l)}
.catalog-list .it small{color:var(--mut);display:block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:10px;align-items:stretch;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.two-col .col{padding:14px 16px;position:relative}
.two-col .col.left{background:linear-gradient(180deg,#F2F7FC 0%,#FBFCFD 55%);border-right:2px dashed var(--line)}
.two-col .col.right{background:linear-gradient(180deg,#FDF6EE 0%,#FDFCFA 55%)}
.two-col .col.left::before,.two-col .col.right::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.two-col .col.left::before{background:var(--blue)}
.two-col .col.right::before{background:var(--gold)}
.colnum{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;margin-right:7px;vertical-align:-3px}
.col.left .colnum{background:var(--blue)}
.col.right .colnum{background:var(--gold)}
.vchart{display:flex;align-items:flex-end;gap:4px;height:150px;padding:6px 2px 0}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbar{width:100%;max-width:36px;background:var(--blue);border-radius:4px 4px 0 0}
.vval{font-size:10px;color:var(--mut);margin-bottom:2px}
.vlbl{font-size:9.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;max-width:100%}
.vchart.gold .vbar{background:var(--gold)}.vchart.green .vbar{background:var(--green)}.vchart.coral .vbar{background:var(--coral)}
.pieLegend{font-size:12px;display:flex;flex-direction:column;gap:3px}
.pieLegend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.roField{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#FAFBFC;color:var(--ink);min-height:19px}
.roField.multi{white-space:pre-wrap;min-height:38px}
.closedBar{background:var(--green-l);border:1px solid var(--green);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.pickpanel{margin-top:6px;padding:9px;background:var(--gray-l);border:1px solid var(--line);border-radius:9px}
.pickpanel .it{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.pickpanel .it:hover{background:var(--blue-l)}
.srcbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
tr.regRow{cursor:pointer}
tr.regRow:hover td{background:var(--blue-l)}
.searchBox{width:100%;max-width:420px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.zoomBtns{display:flex;gap:4px;align-items:center}
.undoBtn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:background .15s}
.undoBtn:hover:not(:disabled){background:rgba(255,255,255,.26)}
.undoBtn:disabled{opacity:.38;cursor:default}
.undoBtn svg{width:14px;height:14px;display:block}
.hdrNav{background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.28)!important;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;margin-left:6px;white-space:nowrap}
.hdrNav:hover{background:rgba(255,255,255,.26)!important}
.hdrNav .reqBadge{position:absolute;top:-6px;right:-6px}
.guideStrip{display:flex;gap:9px;align-items:flex-start;background:var(--blue-l);border:1px solid #CADDF0;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.guideStrip .gi{flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.guideStrip .gx{font-size:12.5px;line-height:1.5;color:#2E4A63}
.guideStrip a{color:var(--blue);font-weight:600;cursor:pointer}
.stepNav{display:flex;gap:10px;align-items:center;margin:22px 0 6px;padding-top:14px;border-top:1px solid var(--line)}
tr.st-done td{background:var(--green-l)!important}
tr.st-prog td{background:var(--gold-l)!important}
tr.st-none td{background:#FBEAE5!important}
tr.cs-zero td{background:#FBEAE5!important}
tr.cs-stat td{background:var(--gold-l)!important}
.hbar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}
.hbar .lbl{width:220px;flex:0 0 220px;text-align:right;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{flex:1;background:var(--gray-l);border-radius:5px;height:20px;position:relative}
.hbar .fill{height:100%;border-radius:5px;background:var(--blue);min-width:2px}
.hbar .val{width:38px;flex:0 0 38px;font-weight:700;color:var(--mut);font-size:12px}
.hbar.green .fill{background:var(--green)}.hbar.coral .fill{background:var(--coral)}.hbar.gold .fill{background:var(--gold)}
.chartrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.chartrow{grid-template-columns:1fr}.hbar .lbl{width:130px;flex-basis:130px}}
.verdict-zone{margin-top:14px;padding:14px;background:var(--green-l);border:1px solid #CADFBB;border-radius:10px}
.verdict-zone .verdict{margin-bottom:4px}
.two-col .col-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.two-col .col.left .col-h{color:#2E5E8C}
.two-col .col.right .col-h{color:#9A7020}
@media (max-width:760px){.two-col{grid-template-columns:1fr}.two-col .col.left{border-right:none;border-bottom:2px dashed var(--line)}}
@media (max-width:900px){.layout{flex-direction:column}nav{width:100%;flex:none;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}nav .step{white-space:nowrap}.grid2{grid-template-columns:1fr}.fieldrow{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:14mm 12mm 14mm 16mm}
  header,nav,.noprint{display:none!important}
  main{max-width:none;padding:0}
  body{background:#fff}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid}
  h1,h2{page-break-after:avoid}
  img{max-width:100%}
  #printStamp{display:block!important}
}
#printStamp{display:none;position:fixed;bottom:4mm;left:0;right:0;text-align:center;font-size:7pt;color:#A5AEB8;font-family:Arial,sans-serif}
.appFooter{max-width:1000px;margin:34px auto 10px;padding:0 2px}
.appFooter .hint{color:var(--mut)}
@media print{.appFooter{display:none}}

function migrateCase(c){
  for(const L of (c.links||[])){
    // авто-код: если ошибка текстом совпадает со строкой каталога — проставить код
    if(!L.errCode&&(L.error||"").trim()){
      const gi=ERR_LIST.findIndex(x=>x.e.trim().toLowerCase()===L.error.trim().toLowerCase());
      if(gi>=0){L.errCode="E"+String(gi+1).padStart(2,"0");L.catStage=ERR_LIST[gi].st;L.catMode=ERR_LIST[gi].m;}
    }
    if(L.circs) continue;
    L.circs=[];
    const letters={}; (c.links||[]).forEach((x,i)=>letters[String.fromCharCode(65+i)]=x.id);
    for(let part of (L.circ||"").split(";")){
      part=part.trim(); if(!part)continue;
      const m=part.match(/\(→\s*звено\s*([A-ZА-Я])\)/i);
      const text=part.replace(/\(→[^)]*\)/g,"").trim();
      if(m&&letters[m[1].toUpperCase()]) L.circs.push({id:uid(),text,kind:"prev",linkRef:letters[m[1].toUpperCase()]});
      else L.circs.push({id:uid(),text,kind:"ext",linkRef:""});
    }
    delete L.circ;
  }
  // миграция мероприятий: actions(key/action/done) → acts(causeId/text/status)
  if(c.actions&&!c.acts){
    c.acts=[];
    for(const a of c.actions){
      if(!(a.action||"").trim()&&!(a.key||"").startsWith("free:"))continue;
      const causeId=(a.key||"").startsWith("c:")?a.key.slice(2):null;
      const status=(a.done||"").trim()?"выполнено":"";
      c.acts.push({id:uid(),causeId,text:a.action||"",who:a.who||"",due:a.due||"",status,dup:false});
    }
    delete c.actions;
  }
  if(!c.acts)c.acts=[];
  if(c.closed===undefined)c.closed=false;
  for(const r of (c.reviews||[])){ // барьер фактора → отдельный список барьеров
    if(!r.barriers){
      r.barriers=[];
      for(const f of (r.factors||[])){
        if((f.barrier||"").trim())
          r.barriers.push({id:uid(),factorId:f.id||"",text:f.barrier,owner:f.owner||"",ownerOther:f.ownerOther||"",state:f.bstate||""});
      }
    }
  }
  for(const x of (c.circs||[])){ // обстоятельства: состояние барьера и свои причины
    if(x.bstate===undefined)x.bstate="";
    if(!x.causes)x.causes=[];
  }
  const inf=c.info||(c.info={});
  if(inf.date!==undefined&&inf.dateISO===undefined){
    inf.dateISO="";inf.time="";
    const m=(inf.date||"").match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
    if(m)inf.dateISO=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
    const t=(inf.date||"").match(/(\d{1,2}):(\d{2})/);
    if(t)inf.time=t[1].padStart(2,"0")+":"+t[2];
    if(!m&&(inf.date||"").trim())inf.desc=((inf.desc||"")+" [дата по старой записи: "+inf.date+"]").trim();
    delete inf.date;
  }
  ["kind","area","spot","tsType","exp","age","victims","unit"].forEach(k=>{if(inf[k]===undefined)inf[k]="";});
  if(!Array.isArray(inf.commission)) inf.commission=[];
  if(!Array.isArray(inf.materials)) inf.materials=MATERIALS_DEF.map(n=>({id:uid(),name:n,has:"",note:""}));
  for(const r of (c.chrono||[])){ // «со слов» → «факт» (обратная логика)
    if(r.isFact===undefined){ r.isFact = !r.assume; delete r.assume; }
    if(!r.isFact) r.inchain=false;
  }
}

      circ:(r.circumstances||"").split(";").map(x=>x.trim()).filter(Boolean),
      ev:r.event||""
    });
  });
  // заменяем содержимое OP_CATALOG, не пересоздавая ссылку
  Object.keys(OP_CATALOG).forEach(k=>delete OP_CATALOG[k]);
  Object.keys(out).forEach(k=>{ OP_CATALOG[k]=out[k]; });
}

function caseRow(c){ // вынесенные колонки для статистики и поиска
  const st=caseStats(c);
  return {
    id:c.id, name:c.name||"Без названия", unit:(c.info&&c.info.unit)||null,
    num:(c.info&&c.info.num)||null,
    date_iso:(c.info&&c.info.dateISO)||null,
    time_str:(c.info&&c.info.time)||null,
    kind:(c.info&&c.info.kind)||null, area:(c.info&&c.info.area)||null,
    spot:(c.info&&c.info.spot)||null, ts_type:(c.info&&c.info.tsType)||null,
    victims:(c.info&&c.info.victims)?parseInt(c.info.victims,10)||null:null,
    causes_count:st.causes, acts_total:st.acts, acts_done:st.done,
    archived:!!c.archived, is_sample:!!c.is_sample,
    data:c
  };
}
async function cloudLoadCases(){
  const r=await api("/rest/v1/cases?select=id,updated_at,data&order=updated_at.desc");

  const rows=await r.json();
  return rows.map(x=>{ const c=x.data||{}; c.id=x.id; c.updated=new Date(x.updated_at).getTime(); migrateCase(c); return c; });
}
let cloudTimer=null, savingQueue=new Set();
function cloudSaveCase(c){

async function flushSaves(){
  if(!CLOUD||!savingQueue.size) return;
  const ids=[...savingQueue]; savingQueue.clear();

  if(!rows.length) return;

      method:"POST",
      headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify(rows)});

function pickImportFile(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) readImportFile(f); };
  document.body.appendChild(inp); inp.click(); inp.remove();

function readImportFile(file){
  const rd=new FileReader();
  rd.onload=async()=>{
    let data=null;
    try{ data=JSON.parse(rd.result); }catch(e){ alert("Файл не читается: нужен файл, выгруженный этим приложением"); return; }
    const cases=(data&&data.cases)||(Array.isArray(data)?data:null);
    if(!cases||!cases.length){ alert("В файле нет дел"); return; }
    if(!confirm("Загрузить дел: "+cases.length+"?")) return;
    const prepared=cases.map(c=>{ const nc=JSON.parse(JSON.stringify(c)); nc.id=newCaseId(); nc.updated=Date.now(); delete nc._imported; migrateCase(nc); return nc; });
    if(CLOUD){
      try{
        const r=await api("/rest/v1/cases",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(prepared.map(caseRow))});
        if(!r.ok){ const t=await r.text(); alert("Не удалось загрузить: "+t.slice(0,300)); return; }
        DB.cases=await cloudLoadCases();
        flash("Загружено дел: "+prepared.length); render();
      }catch(e){ alert("Ошибка загрузки: "+(e.message||e)); }
    } else {
      DB.cases=DB.cases.concat(prepared); save(); render();
      flash("Загружено дел: "+prepared.length);
    }
  };
  rd.readAsText(file);
}

  const from=reassignFrom; if(!from)return;
  const u=(USERS||[]).find(x=>x.id===from);
  const to=(USERS||[]).find(x=>x.id===toId);
  if(!confirm("Передать все расследования «"+(u&&u.full_name||"пользователя")+"» специалисту «"+(to&&to.full_name||"")+"»?"))return;
  try{
    const n=await rpc("reassign_cases",{from_user:from,to_user:toId});
    reassignFrom=null;
    logAction("передача дел",null,(u&&u.full_name||from.slice(0,8))+" → "+(to&&to.full_name||""));
    USERS=null; DB.cases=await cloudLoadCases(); render();
    alert("Передано расследований: "+n);
  }catch(e){ alert("Не удалось передать: "+(e.message||e)); }
}
function cancelReassign(){ reassignFrom=null; render(); }
function reassignPanel(){
  if(!reassignFrom) return "";

      </div>
      <div style="margin-top:12px;text-align:right"><button class="btn sec" onclick="cancelReassign()">Отмена</button></div>
    </div></div>`;
}
async function deleteUser(id){
  const u=(USERS||[]).find(x=>x.id===id); if(!u)return;
  const n=CASECNT[id]||0;
  if(n>0){ alert("У пользователя "+n+" расследований.\n\nСначала передайте их другому специалисту — кнопка «Передать дела»."); return; }
  if(!confirm("Удалить учётную запись «"+(u.full_name||"без имени")+"» безвозвратно?\n\nЗаписи журнала по этому пользователю тоже будут удалены.\nЕсли человек может вернуться — лучше заблокировать."))return;
  if(!confirm("Подтвердите ещё раз: удаление необратимо."))return;
  try{

    USERS=null; render();
  }catch(e){ alert("Не удалось удалить: "+(e.message||e)); }
}
function auditName(l){
  // l — запись журнала. Если пользователь ещё существует в USERS — берём актуальное имя,
  // иначе (удалён) — имя-снимок actor_name, сохранённый в самой записи.
  const uid = (l&&typeof l==="object") ? l.user_id : l;
  const u=(USERS||[]).find(x=>x.id===uid);
  if(u) return (u.full_name||"без имени")+" · "+(u.org||"—");
  if(l&&typeof l==="object"&&l.actor_name) return l.actor_name+" (удалён)";
  return uid ? (uid.slice(0,8)+" (удалён)") : "—";
}
function auditSummary(){
  const m={};
  (AUDIT||[]).forEach(l=>{
    const k=l.user_id||("del:"+(l.actor_name||"?"));  // удалённые (user_id=null) группируем по имени-снимку
    m[k]=m[k]||{uid:l.user_id,actor_name:l.actor_name||"",logins:0,made:0,closed:0,total:0,last:l.at};
    if(!m[k].actor_name && l.actor_name) m[k].actor_name=l.actor_name;
    m[k].total++;
    if(l.action==="вход")m[k].logins++;
    if(l.action==="создание дела")m[k].made++;
    if(l.action==="закрытие дела")m[k].closed++;
    if(l.at>m[k].last)m[k].last=l.at;
  });
  return Object.values(m).sort((a,b)=>b.last.localeCompare(a.last));
}
function fmtAt(s){ if(!s) return "—"; const d=new Date(s); if(isNaN(d.getTime())) return "—"; return d.toLocaleDateString("ru")+" "+d.toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"}); }

/* ===== ПЕРЕПИСКА (вопросы и обсуждения) ===== */
// Состояние чата
let CHAT_MSGS=null;        // загруженные сообщения текущей открытой ветки
let CHAT_TAB="admin";      // вкладка на экране «Вопросы»: 'admin' | 'org'
let CHAT_BUSY=false;
let CHAT_UNREAD=0;         // счётчик непрочитанных
let chatPollTimer=null;    // авто-обновление, пока чат открыт
let unreadTimer=null;      // периодическое обновление счётчика непрочитанных
let CASE_MSGS=null;        // сообщения открытого дела (обсуждение)
let caseChatBusy=false;

// --- счётчик непрочитанных (простой) ---
async function refreshUnread(){
  if(!CLOUD) return;
  try{ const n=await rpc("unread_count",{}); CHAT_UNREAD=(typeof n==="number")?n:parseInt(n,10)||0; }
  catch(e){ /* тихо: счётчик не критичен */ }
}
// независимый счётчик ожидающих заявок на доступ (для значка над кнопкой «Журнал»)
let PENDING_COUNT=0;
async function refreshPending(){
  if(!CLOUD||!PROFILE||!PROFILE.is_admin) return;
  try{
    // лёгкий запрос: только неодобренные, незаблокированные, не-админы
    const r=await api("/rest/v1/profiles?select=id&approved=eq.false&blocked=eq.false&is_admin=eq.false&email_confirmed=eq.true");
    if(r.ok){ const a=await r.json(); PENDING_COUNT=Array.isArray(a)?a.length:0; }
  }catch(e){ /* тихо */ }
}
async function markChatSeen(){
  if(!CLOUD) return;
  try{ await rpc("mark_chat_seen",{}); CHAT_UNREAD=0; }catch(e){}
}

// --- загрузка сообщений ветки «Вопросы» ---
async function loadChat(){
  if(!CLOUD){ CHAT_MSGS=[]; return; }
  chatBusySet(true);
  // администратору нужны имена авторов — подгрузим профили, если их ещё нет
  if(PROFILE&&PROFILE.is_admin&&(USERS===null)){
    try{ const ru=await api("/rest/v1/profiles?select=id,full_name,org,is_admin&order=full_name.asc"); if(ru.ok) USERS=await ru.json(); }catch(e){}
  }
  let q;
  if(CHAT_TAB==="org"){
    q="/rest/v1/messages?select=id,at,author,scope,thread_org,owner,body&scope=eq.org&order=at.asc&limit=500";
  } else { // admin — личная ветка: специалист видит свою (owner=я), админ выбирает ветку отдельно
    q="/rest/v1/messages?select=id,at,author,scope,thread_org,owner,body&scope=eq.admin&order=at.asc&limit=500";
  }
  try{
    const r=await api(q);
    CHAT_MSGS = r.ok ? await r.json() : [];
  }catch(e){ CHAT_MSGS=[]; }
  chatBusySet(false);
  await markChatSeen();
  render();
  startChatPoll("chat");
}
function chatBusySet(v){ CHAT_BUSY=v; }

// тихое авто-обновление ленты, пока открыт чат (эффект «живого» мессенджера)
function startChatPoll(kind){ // kind: 'chat' | 'case'
  stopChatPoll();
  chatPollTimer=setInterval(async ()=>{
    if(!CLOUD){ stopChatPoll(); return; }
    // не мешаем, если пользователь набирает текст
    const active=document.activeElement;
    if(active&&(active.id==="chatInput"||active.id==="caseChatInput")&&active.value.trim()) return;
    try{
      if(kind==="case"){
        if(!S){ return; }
        const r=await api("/rest/v1/messages?select=id,at,author,scope,thread_org,owner,case_id,body&scope=eq.case&case_id=eq."+S.id+"&order=at.asc&limit=500");
        if(r.ok){ const fresh=await r.json(); if(chatChanged(CASE_MSGS,fresh)){ CASE_MSGS=fresh; refreshChatList("caseChatList"); } }
      } else {
        if(statsView!==6) { stopChatPoll(); return; }
        const q = CHAT_TAB==="org" ? "scope=eq.org" : "scope=eq.admin";
        const r=await api("/rest/v1/messages?select=id,at,author,scope,thread_org,owner,body&"+q+"&order=at.asc&limit=500");
        if(r.ok){ const fresh=await r.json(); if(chatChanged(CHAT_MSGS,fresh)){ CHAT_MSGS=fresh; markChatSeen(); refreshChatList("chatList"); } }
      }
    }catch(e){}
  }, 10000);
}
// обновляем ТОЛЬКО ленту сообщений (не весь экран) — чтобы не пересоздавать хедер
// и не терять клики по кнопкам во время авто-обновления
function refreshChatList(listId){
  const list=document.getElementById(listId);
  if(!list){ return; } // ленты нет на экране — просто пропускаем
  const msgs = listId==="caseChatList" ? CASE_MSGS : CHAT_MSGS;
  const scope = listId==="caseChatList" ? "case" : (CHAT_TAB==="org"?"org":"admin");
  list.innerHTML = (msgs&&msgs.length)
    ? msgs.map(m=>chatBubble(m,scope)).join("")
    : `<div class="empty" style="margin:auto;color:var(--mut);font-size:13px">Пока нет сообщений. Напишите первым.</div>`;
  list.scrollTop=list.scrollHeight;
}
function stopChatPoll(){ if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer=null; } }
function chatChanged(a,b){ if(!a) return true; if(a.length!==b.length) return true; return a.length&&b.length&&a[a.length-1].id!==b[b.length-1].id; }
function scrollChat(id){ setTimeout(()=>{ const l=document.getElementById(id); if(l) l.scrollTop=l.scrollHeight; },30); }

// имя автора по id (из USERS у админа, иначе — «специалист»)
function authorName(id){
  if(PROFILE&&id===PROFILE.id) return "Вы"+(PROFILE.is_admin?" (администратор)":"");
  const u=(USERS||[]).find(x=>x.id===id);
  if(u) return (u.full_name||"специалист")+(u.is_admin?" (администратор)":"");
  return "специалист";
}

// --- отправка сообщения ---
async function sendChat(scope, extra){
  const boxId = scope==="case" ? "caseChatInput" : "chatInput";
  const box=document.getElementById(boxId);
  if(!box) return;
  const body=(box.value||"").trim();
  if(!body){ box.focus(); return; }
  if(!CLOUD){ alert("Переписка доступна только при работе с облаком."); return; }
  const rec=Object.assign({ scope, body, author:PROFILE.id }, extra||{});
  try{
    const r=await api("/rest/v1/messages",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify(rec)});
    if(!r.ok){ alert("Не удалось отправить: "+(await r.text()).slice(0,200)); return; }
    const saved=await r.json();
    box.value="";
    if(scope==="case"){ if(!CASE_MSGS)CASE_MSGS=[]; CASE_MSGS.push(saved[0]); }
    else { if(!CHAT_MSGS)CHAT_MSGS=[]; CHAT_MSGS.push(saved[0]); }
    render();
    // прокрутить ленту вниз
    setTimeout(()=>{ const l=document.getElementById(scope==="case"?"caseChatList":"chatList"); if(l)l.scrollTop=l.scrollHeight; },30);
    logAction("сообщение", extra&&extra.case_id?extra.case_id:null, scope);
  }catch(e){ alert("Ошибка отправки: "+(e.message||e)); }
}

// обёртки: берут организацию/дело из состояния, чтобы не прокидывать
// строки через onclick-атрибут (иначе кавычки в названии ломают кнопку)
function sendOrgChat(){
  const org = (PROFILE && PROFILE.org) ? PROFILE.org : "";
  sendChat('org', {thread_org: org});
}
function sendAdminChat(ownerId){
  sendChat('admin', {owner: ownerId || (PROFILE && PROFILE.id)});
}
function sendCaseChat(){
  if(!S) return;
  const org = (S.org) || (PROFILE && PROFILE.org) || "";
  sendChat('case', {case_id: S.id, thread_org: org});
}

// --- удаление своего сообщения ---
async function delChatMsg(id, scope){
  if(!confirm("Удалить сообщение?")) return;
  try{
    const r=await api("/rest/v1/messages?id=eq."+id,{method:"DELETE",headers:{"Prefer":"return=minimal"}});
    if(!r.ok){ alert("Не удалось удалить."); return; }
    if(scope==="case"){ CASE_MSGS=(CASE_MSGS||[]).filter(m=>m.id!==id); }
    else { CHAT_MSGS=(CHAT_MSGS||[]).filter(m=>m.id!==id); }
    render();
  }catch(e){ alert("Ошибка: "+(e.message||e)); }
}

// --- пузырёк сообщения ---
function chatBubble(m, scope){
  const mine = PROFILE && m.author===PROFILE.id;
  const side = mine ? "flex-end" : "flex-start";
  const bg   = mine ? "var(--blue)" : "#EDF1F5";
  const col  = mine ? "#fff" : "var(--ink)";
  const rad  = mine ? "12px 12px 3px 12px" : "12px 12px 12px 3px";
  const d=new Date(m.at);
  const time=d.toLocaleDateString("ru")+" "+d.toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
  const canDel = mine || (PROFILE&&PROFILE.is_admin);
  const nameLine = mine ? authorName(m.author) : authorName(m.author);
  return `<div style="align-self:${side};max-width:80%;margin-bottom:10px">
    <div style="background:${bg};color:${col};padding:9px 13px;border-radius:${rad};font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word">${esc(m.body)}</div>
    <div style="font-size:10px;color:var(--mut);margin-top:3px;${mine?"text-align:right":""}">${esc(nameLine)} · ${time}${canDel?` · <span style="cursor:pointer;color:var(--coral)" onclick="delChatMsg(${m.id},'${scope}')">удалить</span>`:""}</div>
  </div>`;
}

// --- лента + поле ввода ---
function chatLog(msgs, scope, listId, inputId, sendCall){
  const items = (msgs&&msgs.length)
    ? msgs.map(m=>chatBubble(m,scope)).join("")
    : `<div class="empty" style="margin:auto;color:var(--mut);font-size:13px">Пока нет сообщений. Напишите первым.</div>`;
  return `<div id="${listId}" style="display:flex;flex-direction:column;min-height:240px;max-height:52vh;overflow-y:auto;padding:4px 2px">${items}</div>
    <div style="display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:10px" class="noprint">
      <textarea id="${inputId}" rows="2" placeholder="Написать сообщение…" style="flex:1;resize:vertical;min-height:40px" onkeydown="if(event.ctrlKey&&event.key==='Enter'){${sendCall};return false;}"></textarea>
      <button class="btn coral" onclick="${sendCall}">Отправить</button>
    </div>
    <div class="hint" style="margin-top:5px">Ctrl+Enter — отправить. Обновить ленту: <span style="cursor:pointer;color:var(--blue)" onclick="${scope==='case'?'loadCaseChat()':'loadChat()'}">↻ обновить</span></div>`;
}

// --- экран «Вопросы» ---
function screenChat(){
  const isAdmin = PROFILE&&PROFILE.is_admin;
  const tab=(t,label,active)=>`<button class="btn ${active?'':'sec'} noprint" onclick="CHAT_TAB='${t}';CHAT_MSGS=null;loadChat()" style="border-radius:8px">${label}</button>`;
  // ленивая загрузка
  if(CHAT_MSGS===null && !CHAT_BUSY){ loadChat(); }
  const head=`<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px">
      <h2 style="margin:0">Вопросы</h2>
      <span style="flex:1"></span>
      <button class="btn sec noprint" onclick="statsView=0;CHAT_MSGS=null;render()">← к расследованиям</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      ${tab("admin", isAdmin?"Личные вопросы":"Администратору", CHAT_TAB==="admin")}
      ${tab("org","Моя организация", CHAT_TAB==="org")}
    </div>`;

  if(CHAT_BUSY||CHAT_MSGS===null) return `<div class="card">${head}<div class="empty">Загрузка…</div></div>`;

  // Вкладка «Администратору» / «Личные вопросы»
  if(CHAT_TAB==="admin"){
    if(isAdmin){
      // администратор: группируем личные ветки по owner
      const byOwner={};
      (CHAT_MSGS||[]).forEach(m=>{ const k=m.owner||"—"; (byOwner[k]=byOwner[k]||[]).push(m); });
      const owners=Object.keys(byOwner);
      if(!owners.length) return `<div class="card">${head}<div class="empty" style="color:var(--mut)">Личных вопросов пока нет.</div></div>`;
      let sel=window.__chatOwner||owners[0];
      if(!byOwner[sel]) sel=owners[0];
      window.__chatOwner=sel;
      const list=owners.map(o=>{
        const nm=authorName(o); const last=byOwner[o][byOwner[o].length-1];
        return `<div onclick="window.__chatOwner='${o}';render()" style="padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:${o===sel?'var(--blue-l)':'transparent'};border:1px solid var(--line)">
          <b style="font-size:13px">${esc(nm)}</b>
          <div class="hint" style="margin:0">${esc((last.body||"").slice(0,42))}${(last.body||"").length>42?"…":""}</div></div>`;
      }).join("");
      const log=chatLog(byOwner[sel], "admin", "chatList", "chatInput",
        `sendAdminChat('${sel}')`);
      return `<div class="card">${head}
        <div style="display:grid;grid-template-columns:210px 1fr;gap:14px">
          <div style="border-right:1px solid var(--line);padding-right:12px;max-height:60vh;overflow-y:auto"><div class="hint" style="margin:0 0 6px">Кто спрашивал:</div>${list}</div>
          <div>${log}</div>
        </div></div>`;
    } else {
      // специалист: своя личная ветка с админом (owner = я)
      const mine=(CHAT_MSGS||[]).filter(m=>m.owner===PROFILE.id);
      const log=chatLog(mine, "admin", "chatList", "chatInput", `sendAdminChat()`);
      return `<div class="card">${head}
        <div class="sub" style="margin-top:-4px">Личная переписка с администратором Экспертного центра. Здесь можно задать вопрос по методике или работе приложения.</div>
        ${log}</div>`;
    }
  }

  // Вкладка «Моя организация»
  const org = PROFILE ? (PROFILE.org||"") : "";
  const log=chatLog(CHAT_MSGS, "org", "chatList", "chatInput", `sendOrgChat()`);
  return `<div class="card">${head}
    <div class="sub" style="margin-top:-4px">Общий чат вашей организации${org?` «${esc(org)}»`:""}. Виден всем специалистам организации и администратору.</div>
    ${log}</div>`;
}

async function loadCaseChat(){
  if(!CLOUD||!S){ CASE_MSGS=[]; return; }
  caseChatBusy=true;
  try{
    const r=await api("/rest/v1/messages?select=id,at,author,scope,thread_org,owner,case_id,body&scope=eq.case&case_id=eq."+S.id+"&order=at.asc&limit=500");
    CASE_MSGS = r.ok ? await r.json() : [];
  }catch(e){ CASE_MSGS=[]; }
  caseChatBusy=false; render();
  startChatPoll("case");
}
function caseChatBlock(){
  if(!CLOUD) return "";

  if(CASE_MSGS===null && !caseChatBusy){ loadCaseChat(); }
  const org = (S.org)|| (PROFILE&&PROFILE.org) || "";
  const inner = (caseChatBusy||CASE_MSGS===null)
    ? `<div class="empty">Загрузка обсуждения…</div>`

}

// проставить дату согласия в профиль при первом входе (если ещё не стоит)
async function ensureTermsRecorded(){
  if(!CLOUD||!PROFILE) return;
  if(PROFILE.terms_accepted_at) return; // уже зафиксировано
  try{
    const body={ terms_accepted_at:new Date().toISOString(), terms_version:TERMS_VERSION };
    const r=await api("/rest/v1/profiles?id=eq."+PROFILE.id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify(body)});

}

function delCase(id,ev){ev.stopPropagation();if(!confirm("Удалить расследование безвозвратно?"))return;
  if(typeof logAction==="function"){const c=DB.cases.find(x=>x.id===id);logAction("удаление дела",id,c?c.name:"");}
  if(typeof cloudDeleteCase==="function") cloudDeleteCase(id);
  DB.cases=DB.cases.filter(c=>c.id!==id);
  if(typeof CLOUD!=="undefined"&&CLOUD){render();} else save();
  render();}
function archCase(id,ev){
  ev.stopPropagation();
  const c=DB.cases.find(x=>x.id===id); if(!c)return;
  if(c.closed){
    if(!confirm("Извлечь расследование «"+(c.name||"")+"» из архива для правки?"))return;
    c.closed=false; c.archived=false;
    if(typeof logAction==="function")logAction("извлечение из архива",c.id,c.name);
  } else {
    c.archived=!c.archived;
  }
  save(); render();
}

/* ===== ЭКРАН СПИСКА ===== */
function plural(n,one,few,many){
  const m10=n%10,m100=n%100;
  if(m10===1&&m100!==11)return one;
  if(m10>=2&&m10<=4&&(m100<10||m100>=20))return few;
  return many;
}
function caseStats(c){ // причины (без дублей) и мероприятия — как в самом деле
  const meta=c.causeMeta||{};
  let causes=0;
  for(const r of (c.reviews||[])) for(const x of (r.causes||[])) if(!(meta[x.id]&&meta[x.id].dup)) causes++;
  for(const x of (c.circs||[])) if(x.verdict&&x.verdict.kind==="cause"&&!(meta[x.id]&&meta[x.id].dup)) causes++;
  const acts=(c.acts||[]).filter(a=>!a.dup&&(a.text||"").trim());
  return {causes,acts:acts.length,done:acts.filter(a=>a.status==="выполнено").length};
}

function setZoom(d){
  const steps=[1,1.5,2,3,4,6];
  if(d===0){ S._zoom=1; }
  else{
    const cur=S._zoom||1;
    let i=steps.indexOf(cur); if(i<0)i=0;
    i=Math.max(0,Math.min(steps.length-1,i+d));
    S._zoom=steps[i];
  }
  save(); render();
}
function timeVal(t){ const m=(t||"").match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); return m?(+m[1]*60 + +m[2] + (m[3]?+m[3]/60:0)):-1; }
function isPeriod(r){ return !!(r.end&&r.end.trim()); } // период — только если явно задан конец
function inChainAuto(rec){
  const t=(rec.text||"").trim().toLowerCase(); if(!t)return false;
  return S.links.some(L=>[L.event,L.error,L.circ].some(x=>(x||"").toLowerCase().includes(t.slice(0,18))));
}
function isInChain(rec){ return rec.inchain!==undefined ? !!rec.inchain : inChainAuto(rec); }
function stepScale(){
  const rows=S.chrono.filter(r=>r.lane&&(r.time||r.text));
  if(!rows.length)return "";
  // собираем все моменты времени
  const allV=[]; rows.forEach(r=>{const a=timeVal(r.time);if(a>=0)allV.push(a);const b=timeVal(r.end);if(b>=0)allV.push(b);});
  const uniq=[...new Set(allV)].sort((a,b)=>a-b);
  // СЖАТАЯ ОСЬ: большие пустые промежутки между событиями ужимаем,
  // чтобы одна длинная запись (например, 6:00–21:27) не сплющивала остальные.
  // Строим кусочно-линейное отображение реального времени в «экранное».
  let scaleMap=null;
  if(uniq.length>=2){
    const gaps=[];
    for(let i=1;i<uniq.length;i++) gaps.push(uniq[i]-uniq[i-1]);
    const med=gaps.slice().sort((a,b)=>a-b)[Math.floor(gaps.length/2)]||1;
    const CAP=Math.max(med*4, 6); // пустой промежуток не длиннее 4 медиан (или 6 мин)
    // накопленная «экранная» координата
    const pts=[{t:uniq[0],x:0}];
    let acc=0;
    for(let i=1;i<uniq.length;i++){
      const real=uniq[i]-uniq[i-1];
      const shown=Math.min(real,CAP);
      acc+=shown;
      pts.push({t:uniq[i],x:acc});
    }
    const total=acc||1;
    scaleMap={pts,total};
  }
  const tmin=uniq.length?uniq[0]:0, tmax=uniq.length?uniq[uniq.length-1]:1;
  const span=Math.max(tmax-tmin,1);
  function screenX(v){ // реальное время → доля 0..1 по сжатой оси
    if(!scaleMap) return (v-tmin)/span;
    const p=scaleMap.pts;
    if(v<=p[0].t) return 0;
    if(v>=p[p.length-1].t) return 1;
    for(let i=1;i<p.length;i++){
      if(v<=p[i].t){
        const seg=p[i].t-p[i-1].t || 1;
        const frac=(v-p[i-1].t)/seg;
        return (p[i-1].x + frac*(p[i].x-p[i-1].x))/scaleMap.total;
      }
    }
    return 1;
  }
  const pos=v=> v<0?4: 4+screenX(v)*92;
  const activeLanes=LANES.filter(l=>rows.some(r=>r.lane===l));
  const laneHTML=(activeLanes.length?activeLanes:LANES).map(l=>{
    const laneRows=rows.filter(r=>r.lane===l);
    // вертикальная раскладка: группируем по позиции начала, совпадающие идут ниже
    const usedLevels=[]; // массив занятых [left, level]
    const H=l==="О"?"laneО":"";
    let inner="";
    const CAPLEN=14, PXW=760; // ориентировочная ширина трека для оценки подписей
    laneRows.forEach(r=>{
      const va=timeVal(r.time); const left=pos(va);
      const vbP=isPeriod(r)?timeVal(r.end):-1;
      const figR=isPeriod(r)?(vbP>=0?pos(vbP):100):(left+3);
      // ширина подписи в % (время + текст)
      const capTxt=S._noCap?"":(" · "+(r.text||"").slice(0,CAPLEN));
      const lblLen=(isPeriod(r)?11:5)+capTxt.length;
      const lblW=Math.min((lblLen*7.2+20)/PXW*100, 66);
      const nearEnd=isPeriod(r)? (figR+lblW>99) : (left+lblW>99);
      const l0=nearEnd? Math.max(Math.min(left,figR)-lblW,0) : left;
      const r0=nearEnd? figR : Math.max(figR,(isPeriod(r)?figR:left)+lblW);
      let lvl=0; while(usedLevels.some(u=>u.lvl===lvl && l0<u.r+1 && r0>u.l-1)) lvl++;
      usedLevels.push({l:l0,r:r0,lvl});
      const top=8+lvl*17;
      const chain=isInChain(r)?"inchain":"";
      if(isPeriod(r)){
        const vb=timeVal(r.end); let right2=vb>=0?Math.min(pos(vb),96):96;
        if(right2<left) right2=left+3;
        const w=Math.max(right2-left,3);
        const barCls = "step-bar"; // все интервалы одинаково яркие
        inner+=`<div class="${barCls} ${H} ${chain?"inchain":""}" data-ci="${S.chrono.indexOf(r)}" style="left:${left}%;width:${w}%;top:${top+2}px" onmouseenter="scaleTip(event,${S.chrono.indexOf(r)});hlRow(${S.chrono.indexOf(r)},1)" onmouseleave="scaleTipHide();hlRow(${S.chrono.indexOf(r)},0)"></div>`;
        const cap=S._noCap?"":" · "+esc((r.text||"").slice(0,14))+((r.text||"").length>14?"…":"");
        const lblP=`${esc((r.time||"").slice(0,5))}–${esc((r.end||"ДТП").slice(0,5))}${cap}`;
        inner+= (right2+lblW>99)
          ? `<div class="step-time" style="left:${left}%;top:${top}px;transform:translateX(calc(-100% - 5px))">${lblP}</div>`
          : `<div class="step-time" style="left:${right2}%;top:${top}px;margin-left:5px">${lblP}</div>`;
      } else {
        inner+=`<div class="step-dot ${chain} ${H}" data-ci="${S.chrono.indexOf(r)}" style="left:${left}%;top:${top}px" onmouseenter="scaleTip(event,${S.chrono.indexOf(r)});hlRow(${S.chrono.indexOf(r)},1)" onmouseleave="scaleTipHide();hlRow(${S.chrono.indexOf(r)},0)"></div>`;
        const capT=S._noCap?"":" · "+esc((r.text||"").slice(0,14))+((r.text||"").length>14?"…":"");
        const lblT=esc((r.time||"").slice(0,5))+capT;
        inner+= (left+lblW>99)
          ? `<div class="step-time" style="left:${left}%;top:${top}px;transform:translateX(calc(-100% - 9px))">${lblT}</div>`
          : `<div class="step-time" style="left:${left}%;top:${top}px;margin-left:11px">${lblT}</div>`;
      }
    });
    const maxLvl=usedLevels.reduce((m,u)=>Math.max(m,u.lvl),0);
    const laneH=Math.max(34, 20+(maxLvl+1)*17);
    return `<div class="step-lane" style="height:${laneH}px"><div class="lname">${l} · ${LANE_NAMES[l]}</div><div class="step-track">${inner}</div></div>`;
  }).join("");
  const zoom=S._zoom||1;
  return `<div style="display:flex;justify-content:flex-end;gap:6px;align-items:center;margin-bottom:2px" class="noprint">
      <div class="zoomBtns">
        ${zoom!==1?`<button class="btn small sec" onclick="setZoom(0)" title="вернуть 100%">сброс</button>`:""}
        <span class="hint" style="margin:0">Масштаб</span>
        <button class="btn small sec" onclick="setZoom(-1)" title="уменьшить">−</button>
        <span style="font-size:11px;color:var(--mut);min-width:34px;text-align:center">${Math.round(zoom*100)}%</span>
        <button class="btn small sec" onclick="setZoom(1)" title="увеличить">+</button>
      </div>
      <button class="btn small sec" onclick="S._noCap=!S._noCap;render()">${S._noCap?"показать подписи":"скрыть подписи"}</button></div>
    <div style="overflow-x:auto"><div class="step-scale" style="min-width:${Math.round(760*zoom)}px">${laneHTML}</div></div>
    <div class="hint">${(function(){
    if(!scaleMap)return"";
    let big=false;
    for(let i=1;i<scaleMap.pts.length;i++){}
    return "";
  })()}Показаны только заполненные дорожки. Длинные паузы между событиями сжаты, чтобы близкие по времени записи не сливались. Точка — событие, отрезок — период. Совпадающие по времени раскладываются по вертикали. Коралловым — факт «в цепь», дорожка «Операторы» — золотом.</div>`;
}

  const used=new Set(S.chrono.map(r=>r.lane).filter(Boolean));

    if(c.kind==="prev"&&c.linkRef&&byId[c.linkRef]){isSource[c.linkRef]=true;(kids[c.linkRef]=kids[c.linkRef]||[]).push(L.id);}
  }));
  // УРОВЕНЬ ОТ ФИНАЛА (а не от истока): финал = 0; причина = уровень своего
  // следствия + 1. Благодаря этому ВСЕ причины одного следствия получают
  // одинаковый уровень и встают в одну колонку друг под другом.
  const outTo={};                       // звено → в какие следствия оно ведёт
  links.forEach(L=>(L.circs||[]).forEach(c=>{
    if(c.kind==="prev"&&c.linkRef&&byId[c.linkRef]) (outTo[c.linkRef]=outTo[c.linkRef]||[]).push(L.id);
  }));
  const level={};
  function lv(id,seen){
    if(level[id]!==undefined)return level[id];
    seen=seen||new Set(); if(seen.has(id))return 0; seen.add(id);
    const outs=outTo[id]||[];
    level[id]=outs.length?1+Math.max(...outs.map(x=>lv(x,seen))):0;
    return level[id];
  }
  links.forEach(L=>lv(L.id));
  const maxLv=Math.max(...links.map(L=>level[L.id]));
  const depth={}; links.forEach(L=>{depth[L.id]=maxLv-level[L.id];});  // финал остаётся справа
  const IN_W=175,EV_W=175,GX=95,GY=26,BH=48,BGAP=10;
  const trim=(t,n)=> (t||"").length>n?(t.slice(0,n-1)+"…"):(t||"");
  function nodeBlocks(L){
    const bl=[];
    if(L.pure) bl.push({kind:"pure"});
    else bl.push({kind:"err",text:L.error,who:L.who,code:L.errCode});
    (L.circs||[]).filter(c=>c.kind==="prev"&&c.linkRef&&byId[c.linkRef]).forEach(c=>bl.push({kind:"prevIn",ref:c.linkRef,text:byId[c.linkRef].L.event||c.text}));
    const ext=(L.circs||[]).filter(c=>c.kind!=="prev").map(c=>c.text).filter(Boolean);
    if(ext.length||bl.length===0) bl.push({kind:"ext",text:ext.join("; ")||"—"});
    return bl;
  }
  const blocksOf={}; links.forEach(L=>blocksOf[L.id]=nodeBlocks(L));
  const nodeH=L=>{const n=blocksOf[L.id].length;return n*BH+(n-1)*BGAP;};
  const nodeW=L=> isSource[L.id]? IN_W : IN_W+20+EV_W;
  const cols={}; links.forEach(L=>{const dd=depth[L.id];(cols[dd]=cols[dd]||[]).push(L.id);});
  const dds=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  // ПОРЯДОК ВНУТРИ КОЛОНКИ: идём справа налево. Причины одного следствия
  // становятся соседями, а группы причин следуют порядку своих следствий —
  // так стрелки не перехлёстываются. Внутри группы порядок как в списке.
  const idx={}; links.forEach((L,i)=>{idx[L.id]=i;});
  const rank={};
  for(let k=dds.length-1;k>=0;k--){
    const dd=dds[k];
    const key=id=>Math.min(...(outTo[id]||[]).map(x=>rank[x]!==undefined?rank[x]:1e9),1e9);
    cols[dd].sort((a,b)=> (key(a)-key(b)) || (idx[a]-idx[b]) );
    cols[dd].forEach((id,r)=>{rank[id]=r;});
  }
  const colW={}; dds.forEach(dd=>{colW[dd]=Math.max(...cols[dd].map(id=>nodeW(byId[id].L)));});
  const pos={}; let xAcc=20, maxBottom=0;
  dds.forEach(dd=>{
    let yAcc=30;
    cols[dd].forEach(id=>{pos[id]={x:xAcc,y:yAcc};yAcc+=nodeH(byId[id].L)+GY;});
    maxBottom=Math.max(maxBottom,yAcc);
    xAcc+=colW[dd]+GX;
  });
  const svgW=xAcc+10, svgH=maxBottom+20;
  // координаты вход-блоков (для прицела стрелок): inPos[nodeId][refId]={x,y}
  const inPos={};
  links.forEach(L=>{
    const p=pos[L.id]; inPos[L.id]={};
    blocksOf[L.id].forEach((b,bi)=>{ b._y=p.y+bi*(BH+BGAP); if(b.kind==="prevIn") inPos[L.id][b.ref]={x:p.x,y:b._y+BH/2}; });
  });
  let out="";
  // внешние стрелки: от каждого блока источника к его блоку «СОБЫТИЕ · Y» в потомке
  links.forEach(Y=>{
    if(!isSource[Y.id])return;
    const p=pos[Y.id];
    (kids[Y.id]||[]).forEach(childId=>{
      const tgt=inPos[childId][Y.id]; if(!tgt)return;
      blocksOf[Y.id].forEach(b=>{
        const ay=b._y+BH/2, ax=p.x+IN_W;
        const mk=b.kind==="err"?"arrc":(b.kind==="prevIn"?"arr":"arrg");
        const col=b.kind==="err"?"#C4674A":(b.kind==="prevIn"?"#4A79A8":"#8A96A3");
        out+=`<path d="M${ax},${ay} C${ax+GX/2},${ay} ${tgt.x-GX/2},${tgt.y} ${tgt.x},${tgt.y}" fill="none" stroke="${col}" stroke-width="1.8" marker-end="url(#${mk})"/>`;
      });
    });
  });
  // узлы
  links.forEach((L,i)=>{
    const p=pos[L.id], NH=nodeH(L);
    // литера над блоками
    out+=`<text x="${p.x}" y="${p.y-8}" font-size="12" font-weight="bold" fill="#2E4A66">${linkLetter(i)}</text>`;
    blocksOf[L.id].forEach(b=>{
      const y=b._y;
      if(b.kind==="pure"){
        out+=`<rect x="${p.x}" y="${y}" width="${IN_W}" height="${BH}" rx="8" fill="#FBFCFD" stroke="#9AA6B1" stroke-dasharray="4 3"/>
          <text x="${p.x+8}" y="${y+28}" font-size="10.5" fill="#5B6B7C">чистое развитие</text>`;
      } else if(b.kind==="err"){
        out+=`<rect x="${p.x}" y="${y}" width="${IN_W}" height="${BH}" rx="8" fill="#F8E7DF" stroke="#C4674A" stroke-width="1.8"/>
          <text x="${p.x+8}" y="${y+15}" font-size="9.5" font-weight="bold" fill="#C4674A">ОШИБКА${b.who?" · "+esc(trim(b.who,15)):""}${b.code?" · "+esc(b.code):""}</text>
          <text x="${p.x+8}" y="${y+33}" font-size="10.5" fill="#1E2A38">${esc(trim(b.text,30))}</text>`;
      } else if(b.kind==="prevIn"){
        const litera=linkLetter(byId[b.ref].i);
        out+=`<rect x="${p.x}" y="${y}" width="${IN_W}" height="${BH}" rx="8" fill="#EAF3FB" stroke="#4A79A8" stroke-width="1.8"/>
          <text x="${p.x+8}" y="${y+15}" font-size="9.5" font-weight="bold" fill="#2E5E8C">СОБЫТИЕ · ${litera}</text>
          <text x="${p.x+8}" y="${y+33}" font-size="10.5" fill="#1E2A38">${esc(trim(b.text,30))}</text>`;
      } else {
        out+=`<rect x="${p.x}" y="${y}" width="${IN_W}" height="${BH}" rx="8" fill="#EDF0F3" stroke="#8A96A3" stroke-width="1.5"/>
          <text x="${p.x+8}" y="${y+15}" font-size="9.5" font-weight="bold" fill="#5B6B7C">ОБСТОЯТЕЛЬСТВА</text>
          <text x="${p.x+8}" y="${y+33}" font-size="10" fill="#1E2A38">${esc(trim(b.text,32))}</text>`;
      }
    });
    // собственный синий блок события (если не источник) + внутренние стрелки
    if(!isSource[L.id]){
      const evX=p.x+IN_W+20, evY=p.y+NH/2-27;
      out+=`<rect x="${evX}" y="${evY}" width="${EV_W}" height="54" rx="9" fill="#E3EDF6" stroke="#4A79A8" stroke-width="2"/>
        <text x="${evX+9}" y="${evY+21}" font-size="12.5" font-weight="bold" fill="#2E4A66">${linkLetter(i)} · событие</text>
        <text x="${evX+9}" y="${evY+39}" font-size="11" fill="#1E2A38">${esc(trim(L.event,26))}</text>`;
      blocksOf[L.id].forEach(b=>{
        const ay=b._y+BH/2;
        const mk=b.kind==="err"?"arrc":(b.kind==="prevIn"?"arr":"arrg");
        const col=b.kind==="err"?"#C4674A":(b.kind==="prevIn"?"#4A79A8":"#8A96A3");
        out+=`<line x1="${p.x+IN_W}" y1="${ay}" x2="${evX}" y2="${evY+27}" stroke="${col}" stroke-width="1.6" marker-end="url(#${mk})"/>`;
      });
    }
  });
  return `<div style="overflow-x:auto"><svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A79A8"/></marker>
      <marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C4674A"/></marker>
      <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker>
    </defs>
    ${out}</svg>
    <div class="hint">Событие звена-источника не дублируется: от его <span style="color:var(--coral)">ошибки</span> и <span style="color:#5B6B7C">обстоятельств</span> две стрелки идут в голубой блок «СОБЫТИЕ · литера» следующего звена. Синий блок справа — только у звеньев, чьё событие никуда не передано (финал цепи).</div></div>`;
}

/* ===== СДК-МАСТЕР ===== */
function sdkRender(r){
  if(!SDK_TREE || !SDK_TREE.q){
    return `<div class="warn" style="margin:8px 0">Методика СДК-мастера загружается с сервера и доступна одобренным пользователям. Если вы вошли и видите это сообщение — обновите страницу или проверьте связь с облаком.</div>`;
  }
  const s=r.sdk||(r.sdk={});
  // путь по дереву согласно s.path (массив ключей)
  s.path=s.path||[];
  let node=SDK_TREE, steps=[], result=null;
  const ask=(node,keyOpts)=>steps.push({node,keyOpts});
  // ручной обход по фиксированной структуре
  function walk(node){
    if(node.type){result=node;return;}
    // это вопрос
    const q=node.q;
    // варианты в зависимости от узла
    if(node===SDK_TREE){
      steps.push({q,opts:[["no","Нет — ненамеренное"],["yes","Да — намеренное"]],sel:s.namer});
      if(s.namer==="no") walk(node.no);
      else if(s.namer==="yes") walk(node.yes);
    } else if(node===SDK_TREE.no){
      steps.push({q,opts:[["attention","Внимание"],["memory","Память"]],sel:s.nomem});
      if(s.nomem==="attention")result=node.attention; else if(s.nomem==="memory")result=node.memory;
    } else if(node===SDK_TREE.yes){
      steps.push({q,opts:[["yes","Да — считал правильным"],["no","Нет — знал, что нельзя"]],sel:s.right});
      if(s.right==="yes")walk(node.yes); else if(s.right==="no")walk(node.no);
    } else if(node===SDK_TREE.yes.yes){
      steps.push({q,opts:[["rule","Правило было (на основе правил)"],["knowledge","Правила не было (на основе знаний)"]],sel:s.hadrule});
      if(s.hadrule==="rule")walk(node.rule); else if(s.hadrule==="knowledge")result=node.knowledge;
    } else if(node===SDK_TREE.yes.yes.rule){
      steps.push({q,opts:[["good_bad","Применено правильно, но правило плохое"],["wrong_apply","Хорошее правило применено неверно"]],sel:s.ruleq});
      if(s.ruleq==="good_bad")result=node.good_bad; else if(s.ruleq==="wrong_apply")result=node.wrong_apply;
    } else if(node===SDK_TREE.yes.no){
      steps.push({q,opts:[["routine","Рутинное («все так делают»)"],["situational","Ситуационное (иначе не выполнить)"],["exceptional","Исключительное (ЧС, нет правил)"],["optimizing","Оптимизационное (ради выгоды)"],["sabotage","Саботаж (умысел)"]],sel:s.viol});
      const map={routine:node.routine,situational:node.situational,exceptional:node.exceptional,optimizing:node.optimizing,sabotage:node.sabotage};
      if(s.viol&&map[s.viol])result=map[s.viol];
    }
  }
  walk(SDK_TREE);
  // применить результат в поля разбора
  if(result){ r.type=result.type; r.subtype=result.sub||""; r._sdkClass=result.cls; r._sdkCond=result.cond; }
  else { r.type=""; r.subtype=""; r._sdkCond=null; }
  // рендер вопросов
  let html="";
  steps.forEach((st,idx)=>{
    html+=`<div class="sdk-node"><div class="sdk-q">${esc(st.q)}</div><div class="sdk-opts">`+
      st.opts.map(o=>`<span class="opt ${st.sel===o[0]?"":""}" style="${st.sel===o[0]?"border-color:var(--ink);background:var(--ink);color:#fff;font-weight:600":""}" onclick="sdkPick('${r.id}',${idx},'${o[0]}')">${esc(o[1])}</span>`).join("")+
      `</div></div>`;
  });
  if(result){
    html+=`<div class="sdk-result"><b>Тип:</b> ${esc(result.type)}${result.sub?" · "+esc(result.sub):""} <span class="klist">(${esc(result.cls)})</span></div>`;
    html+=`<div class="sdk-cond"><b>Условия, при которых возникает такая ошибка</b> (проверьте, что из этого было): ${result.cond.map(c=>esc(c)).join(" · ")}</div>`;
    html+=`<div class="hint">Класс мер: <b>${esc(CLASS_BY_TYPE[result.type]||"—")}</b>.</div>`;
  }
  return html;
}
function sdkPick(rid,stepIdx,val){
  const r=S.reviews.find(x=>x.id===rid)||findReview(rid); if(!r)return;
  const s=r.sdk||(r.sdk={});
  const keys=["namer"]; // сбрасываем нижележащие при смене
  // ключи по глубине
  const depthKeys=[["namer"],["nomem","right"],["hadrule","viol"],["ruleq"]];
  // проще: держим отдельные поля и чистим зависимые
  const map=[ ["namer"], ["nomem","right"], ["hadrule","viol"], ["ruleq"] ];
  // определить какое поле соответствует шагу
  const fieldByStep=stepFields(r);
  const f=fieldByStep[stepIdx]; if(!f)return;
  s[f]=val;
  // очистить все поля глубже
  const order=["namer","nomem","right","hadrule","viol","ruleq"];
  const clearFrom=order.indexOf(f)+1;
  // но nomem/right и hadrule/viol на разных ветвях — чистим все глубже по порядку появления
  for(let k=clearFrom;k<order.length;k++) delete s[order[k]];
  save();render();
}
function stepFields(r){ // порядок полей, соответствующий отрисованным шагам
  const s=r.sdk||{}; const f=["namer"];
  if(s.namer==="no")f.push("nomem");
  else if(s.namer==="yes"){f.push("right");
    if(s.right==="yes"){f.push("hadrule");
      if(s.hadrule==="rule")f.push("ruleq");}
    else if(s.right==="no")f.push("viol");
  }
  return f;
}
function findReview(id){return S.reviews.find(x=>x.id===id);}
/* ===== ШАГ 3: РАЗБОР ОШИБОК — две колонки, барьер на каждый фактор ===== */
/* Модель разбора:
   r.factors = [ {id, name, barrier, owner, ownerOther, bstate, verdict:{kind,text,target,errText,childId,reviewId}} ]
   Каждый фактор несёт СВОЙ барьер и СВОЙ вывод → из одного разбора может выйти несколько причин. */

function factorPalette(r){
  const id=uid();
  setTimeout(()=>{const box=document.getElementById(id);if(!box)return;
    box.querySelectorAll(".chip[data-v]").forEach(c=>{
      const on=(r.factors||[]).some(f=>f.name===c.dataset.v);
      if(on)c.classList.add("on");
      c.onclick=()=>{r.factors=r.factors||[];
        const i=r.factors.findIndex(f=>f.name===c.dataset.v);
        if(i>=0)r.factors.splice(i,1);
        else r.factors.push({id:uid(),name:c.dataset.v,barrier:"",owner:"",ownerOther:"",bstate:"",verdict:{}});
        save();render();};
    });},0);
  const mk=a=>a.map(f=>`<span class="chip" data-v="${esc(f)}">${esc(f)}</span>`).join("");
  return `<div id="${id}"><span class="chip fam">способность — «не смог»</span>${mk(FACT_ABILITY)}<span class="chip fam">воля — «не стал»</span>${mk(FACT_WILL)}</div>`;
}
function famWarnF(r,f){
  if(!r.type)return "";
  const will=FACT_WILL.includes(f.name),abil=FACT_ABILITY.includes(f.name);
  if(r.type==="нарушение"&&abil)return `<div class="warn">Нарушение обычно из семьи воли; этот фактор — из способности. Проверьте.</div>`;
  if(["промах","упущение","заблуждение"].includes(r.type)&&will)return `<div class="warn">Ненамеренный тип обычно из семьи способности; этот фактор — из воли. Проверьте.</div>`;
  return "";
}
function ownerSelect(obj){
  // роль + поле «другое»
  const selHtml=sel(obj,"owner",ROLES,()=>render());
  const other = obj.owner==="другое (указать)" ? `<div style="margin-top:4px">${inp(obj,"ownerOther","укажите роль")}</div>` : "";
  return selHtml+other;
}

/* ===== ПРИЧИНЫ РАЗБОРА (простой список) ===== */
function reviewCauses(r){ return r.causes||(r.causes=[]); }
function causeRow(r,c,i){
  return `<div class="card" style="border-left:4px solid var(--green);padding:11px;margin-bottom:8px;background:#F6FAF3">
    <div style="display:flex;gap:8px;align-items:baseline">
      <span class="mono" style="font-weight:700;color:var(--green)">${i+1}</span>
      <div style="flex:1"><label>Системная причина (несработавший барьер)</label>${inp(c,"text","«нет обучения технике спусков»")}</div>
      <button class="btn small danger noprint" onclick="delCause('${r.id}','${c.id}')">✕</button>
    </div>
    <div style="margin-top:6px;max-width:340px"><label>Категория</label>${sel(c,"cat",CATS)}</div>
  </div>`;
}
function addCause(rid){const r=findReview(rid);if(!r)return;
  reviewCauses(r).push({id:uid(),text:"",owner:"",ownerOther:"",cat:""});save();render();}
function delCause(rid,cid){const r=findReview(rid);if(!r)return;
  r.causes=(r.causes||[]).filter(c=>c.id!==cid);save();render();}

function stageHint(stage){
  if(!stage)return "";
  if(stage==="восприятие"||stage==="действие")
    return `<div class="hint" style="background:var(--blue-l);padding:6px 9px;border-radius:8px;margin-top:6px">Подсказка: сбой на этапе «${stage}» — вероятно, <b>ошибка на основе навыка</b> (промах или упущение). Проверьте в мастере.</div>`;
  return `<div class="hint" style="background:var(--gold-l);padding:6px 9px;border-radius:8px;margin-top:6px">Подсказка: сбой на этапе «${stage}» — вероятно, <b>ошибка на основе правил или знаний</b> (заблуждение). Но проверьте: не сознательное ли это нарушение?</div>`;
}

function reviewCard(r){
  const kids=S.reviews.filter(x=>x.parent===r.id);
  const cls=(r.causes&&r.causes.length)?"cause":"";
  const canDel=!kids.length;
  const typePill=r.type?`<span class="pill">${esc(r.type)}${r.subtype?" · "+esc(r.subtype):""}</span>`:"";
  const facts=validFactors(r);
  return `<div class="review ${cls}" id="rv${r.id}">
    <h4>Разбор ошибки <span class="who">${esc(displayRole(r))}</span>${r.from?`<span class="from">${esc(r.from)}</span>`:""}${typePill}
      <span style="flex:1"></span>${canDel?`<button class="btn small danger noprint" onclick="delReview('${r.id}')">удалить</button>`:""}</h4>
    <div class="fieldrow"><span>Ошибка (акт)</span><div>${inp(r,"error","",true)}<div style="max-width:340px;margin-top:6px">${ownerSelectReview(r)}</div></div></div>

    <div class="two-col">
      <div class="col left">
        <div class="col-h"><span class="colnum">1</span>Где сломалось · что за ошибка</div>
        ${sdkStage(r)}
        ${stageHint(r.stage)}
        <div style="margin-top:10px">${sdkRender(r)}</div>
      </div>
      <div class="col right">
        <div class="col-h"><span class="colnum">2</span>Что вызвало (факторы)</div>
        ${factorPalette(r)}
        <div style="margin-top:8px">
          ${facts.length? facts.map(f=>famWarnF(r,f)+factorCard(r,f)).join("") : `<div class="hint">Выберите факторы — они подскажут, какие барьеры (обучение, РТО, контроль) должны были сработать.</div>`}
          ${barriersBlock(r)}
        </div>
      </div>
    </div>

    <div class="verdict-zone">
      <div class="col-h" style="margin-bottom:8px;color:#4A7A3A"><span class="colnum" style="background:var(--green)">3</span>Системные причины этого разбора</div>
      ${reviewCauses(r).length? reviewCauses(r).map((c,i)=>causeRow(r,c,i)).join("") : `<div class="hint" style="margin-bottom:8px">Причин пока нет. Причина = несработавший барьер, за который отвечает кто-то в организации. Одна ошибка может дать несколько причин.</div>`}
      <button class="btn coral noprint" onclick="addCause('${r.id}')">+ Добавить системную причину</button>
    </div>

function addBarrier(reviewId,factorId){

}
function delBarrier(reviewId,bid){

function barrierCard(r,b){

function barriersBlock(r){

      ${LOCKED()?"":`<button class="btn small coral noprint" onclick="addBarrier('${r.id}','')">+ барьер</button>`}
    </div>

      : `<div class="hint">Барьеров нет. На одну ошибку их может быть несколько — по каждому фактору свой.</div>`}

function factorBarrierName(f){
  // подсказка барьера по фактору
  const map={"квалификация: знание":"обучение","квалификация: навык":"тренировка/дрилл","квалификация: опыт":"наставничество","физиология":"медконтроль","усталость":"режим труда и отдыха","отвлечение":"политика гаджетов, контроль","эмоции":"поддержка, отбор","установки / мотивация":"мотивация, культура, санкции","устойчивые черты":"профотбор"};
  return map[f.name]||"—";
}
function validFactors(r){ return (r.factors||[]).filter(f=>f&&f.name); }
function displayRole(r){ return r.owner==="другое (указать)"?(r.ownerOther||"другое"):(r.owner||"—"); }
function ownerSelectReview(r){

}
function sdkStage(r){

}

/* ===== ШАГ 4: ОБСТОЯТЕЛЬСТВА (вопрос о влиянии) ===== */
function circRow(c,i){
  const v=c.verdict||(c.verdict={});
  let body="";
  if(c.influence===undefined||c.influence===""){
    body=`<div class="sdk-node"><div class="sdk-q">Имеет ли компания влияние на это обстоятельство (сейчас или в будущем)?</div>
      <div class="sdk-opts">
        <span class="opt" onclick="setInfl(${i},'yes')">Да — влияние есть</span>
        <span class="opt" onclick="setInfl(${i},'no')">Нет — управы нет</span></div></div>`;
  } else if(c.influence==="no"){
    v.kind="stop";
    body=`<div class="hint" style="margin-top:6px">Влияния нет → остальные поля бесполезны. Итог: <b>непредотвратимое, стоп</b> (законно). <span class="noprint"><a href="#" onclick="setInfl(${i},'');return false">изменить</a></span></div>`;
  } else {
    v.kind="cause";
    c.causes=c.causes||[];
    body=`<div style="margin-top:8px"><label>Несработавший барьер (должен был предотвратить или нейтрализовать)</label>${inp(c,"barrier","«нет весового контроля на выезде»")}
        <div class="grid2" style="margin-top:6px">
          <div><label>Владелец (роль)</label>${ownerSelect(c)}</div>
          <div><label>Состояние барьера</label>${sel(c,"bstate",BSTATES)}</div>
        </div></div>
      <div class="causebox" style="margin-top:8px"><b>Системная причина:</b> ${inp(v,"text","«маршрут назначается без учёта фактической массы и профиля»")}
        <div style="max-width:230px;margin-top:6px"><label>Категория</label>${sel(v,"cat",CATS)}</div></div>
      ${c.causes.map((x,xi)=>`<div class="causebox" style="margin-top:6px">
          <div style="display:flex;gap:8px"><div style="flex:1"><b>Ещё причина:</b> ${inp(x,"text","формулировка")}</div>
          ${LOCKED()?"":`<button class="btn small danger noprint" style="align-self:flex-start" onclick="S.circs[${i}].causes.splice(${xi},1);save();render()">✕</button>`}</div>
          <div style="max-width:230px;margin-top:6px"><label>Категория</label>${sel(x,"cat",CATS)}</div></div>`).join("")}
      ${LOCKED()?"":`<button class="btn small sec noprint" style="margin-top:6px" onclick="S.circs[${i}].causes.push({id:uid(),text:'',cat:''});save();render()">+ ещё системная причина</button>`}`;
  }
  return `<div class="card" style="border-left:5px solid var(--blue)">
    <div style="display:flex;gap:10px"><div style="flex:1">
      <div class="fieldrow"><span>Обстоятельство</span><div>${inp(c,"text","",true)}</div></div>${body}
    </div><button class="btn small danger noprint" style="align-self:flex-start" onclick="S.circs.splice(${i},1);save();render()">✕</button></div></div>`;
}
function setInfl(i,val){const c=S.circs[i];c.influence=val;
  if(val==="no")c.verdict={kind:"stop"};
  else if(val==="yes"){c.verdict={kind:"cause",text:c.verdict&&c.verdict.text||"",cat:c.verdict&&c.verdict.cat||""};}
  else {c.verdict={};}
  save();render();}
function pullCircs(){
  const have=new Set(S.circs.map(c=>(c.text||"").trim().toLowerCase()));
  for(const L of S.links){
    for(const c of (L.circs||[])){
      if(c.kind==="prev")continue; // события пред. звена не идут в шаг 4 — они разбираются своим звеном
      const t=(c.text||"").trim(); if(!t||have.has(t.toLowerCase()))continue;
      S.circs.push({id:uid(),text:t,influence:"",barrier:"",owner:"",ownerOther:"",bstate:"",causes:[],verdict:{}});
      have.add(t.toLowerCase());
    }
  }
  save();render();}
function screen4(){
  return `<h2>Шаг 4 · Обстоятельства</h2>
  <div class="sub">Первый вопрос — <b>имеет ли компания влияние</b>. Нет — «непредотвратимое, стоп». Да — назовите несработавший барьер, его владельца и состояние, затем сформулируйте системные причины (их может быть несколько).</div>
  ${LOCKED()?"":`<div class="noprint" style="margin-bottom:10px">
    <button class="btn sec" onclick="pullCircs()">Подтянуть из звеньев</button>
    <button class="btn sec" onclick="S.circs.push({id:uid(),text:'',influence:'',barrier:'',owner:'',ownerOther:'',bstate:'',causes:[],verdict:{}});save();render()">+ Вручную</button></div>`}
  ${S.circs.length?S.circs.map(circRow).join(""):`<div class="empty">Обстоятельств нет — подтяните из звеньев.</div>`}`;
}
/* ===== ПРИЧИНЫ (порядок, дубли, мероприятия-дети) ===== */
function roleOf(r){return r.owner==="другое (указать)"?(r.ownerOther||"другое"):(r.owner||"");}
function causes(){
  const out=[];
  for(const r of S.reviews) for(const c of (r.causes||[]))
    out.push({id:c.id,kind:"review",obj:c,text:c.text||"",role:roleOf(c)||roleOf(r),type:r.type||"",src:"разбор: "+(r.error||"").slice(0,45)});
  for(const c of S.circs) if(c.verdict&&c.verdict.kind==="cause"){
    out.push({id:c.id,kind:"circ",obj:c.verdict,text:c.verdict.text||"",role:roleOf(c),type:"",src:"обстоятельство: "+(c.text||"").slice(0,50)});
    for(const x of (c.causes||[]))
      out.push({id:x.id,kind:"circ",obj:x,text:x.text||"",role:roleOf(c),type:"",src:"обстоятельство: "+(c.text||"").slice(0,50)});
  }
  out.forEach(c=>{const m=S.causeMeta[c.id]||{};c.dup=!!m.dup;c.needStats=!!m.needStats;});
  const ord=S.causeOrder||[];
  out.sort((a,b)=>{
    const ia=ord.indexOf(a.id), ib=ord.indexOf(b.id);
    return (ia<0?1e9:ia)-(ib<0?1e9:ib);
  });
  return out;
}
function moveCause(id,d){
  const ids=causes().map(c=>c.id);
  const i=ids.indexOf(id), j=i+d;
  if(i<0||j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];
  S.causeOrder=ids; save(); render();
}
function toggleDup(id){S.causeMeta[id]=S.causeMeta[id]||{};S.causeMeta[id].dup=!S.causeMeta[id].dup;save();render();}
function toggleNeedStats(id){S.causeMeta[id]=S.causeMeta[id]||{};S.causeMeta[id].needStats=!S.causeMeta[id].needStats;save();render();}

/* мероприятия причины (шаг 5: только текст) */
function actsOf(causeId){S.acts=S.acts||[];return S.acts.filter(a=>a.causeId===causeId);}

function delAct(id){S.acts=(S.acts||[]).filter(a=>a.id!==id);save();render();}
function toggleActDup(id){const a=(S.acts||[]).find(x=>x.id===id);if(a){a.dup=!a.dup;save();render();}}

        ${c.dup?"":`<div style="margin-top:10px;padding:9px 11px;background:#FBFCFD;border:1px solid var(--line);border-radius:8px">

            :(actRows||`<div class="hint" style="margin-top:4px">Пока нет — добавьте кнопкой; исполнителя и срок допишете на шаге 6.</div>`)}

}

/* ===== ШАГ 6: МЕРОПРИЯТИЯ (исполнитель, срок, статус, сортировка) ===== */
function classForCause(c){ if(c.type&&CLASS_BY_TYPE[c.type])return CLASS_BY_TYPE[c.type]; return ""; }
function moveAction(id,d){
  const disp=displayActs();
  const ids=disp.map(x=>x.a.id);
  if(S.actionSort&&S.actionSort.col){S.actionSort=null;}
  const i=ids.indexOf(id), j=i+d;
  if(i<0||j<0||j>=ids.length){S.actionOrder=ids;save();render();return;}
  [ids[i],ids[j]]=[ids[j],ids[i]];
  S.actionOrder=ids; save(); render();
}
function sortActions(col){
  const s0=S.actionSort;
  if(s0&&s0.col===col){ S.actionSort = s0.dir>0? {col,dir:-1} : null; }
  else S.actionSort={col,dir:1};
  save(); render();
}
function displayActs(){ // [{a,causeLabel}] в отображаемом порядке
  S.acts=S.acts||[];
  const cs=causes().filter(c=>!c.dup);
  const label={}; cs.forEach(c=>label[c.id]="Причина "+(cs.indexOf(c)+1)+": "+(c.text||"—").slice(0,50));
  const rows=S.acts.filter(a=>a.causeId===null||label[a.causeId]!==undefined||a.causeId==="")
    .map(a=>({a,causeLabel:a.causeId?(label[a.causeId]||"Причина (дубль/удалена)"):"Дополнительно (без причины)"}));
  const aord=S.actionOrder||[];
  rows.sort((x,y)=>{const ia=aord.indexOf(x.a.id),ib=aord.indexOf(y.a.id);return (ia<0?1e9:ia)-(ib<0?1e9:ib);});
  const srt=S.actionSort;
  if(srt&&srt.col){
    const val=r=> srt.col==="label"?r.causeLabel:String(r.a[srt.col]||"");
    rows.sort((x,y)=>val(x).localeCompare(val(y),"ru")*srt.dir);
  }
  return rows;
}
function actStatusClass(st){ return st==="выполнено"?"st-done":(st==="в процессе"?"st-prog":"st-none"); }
function screen7(){
  const disp=displayActs();

      ${a.causeId?"":`<button class="btn small danger noprint" onclick="delAct('${a.id}')">✕</button>`}
    </div></td></tr>`).join("");
  const th=[["label","К чему"],["text","Мероприятие"],["who","Исполнитель (роль)"],["due","Срок"],["status","Статус"]].map(h=>{

function closeChecks(){
  const cs=causes().filter(c=>!c.dup);
  const problems=[];
  const noCauseDeclared=cs.length===0 && S.circs.length>0 &&
    S.circs.every(c=>c.verdict&&c.verdict.kind==="stop");
  if(cs.length===0&&!noCauseDeclared)
    problems.push("Нет системных причин. Либо сформулируйте их, либо доведите все обстоятельства до вывода «влияния нет» — тогда происшествие закрывается как непредотвратимое.");
  cs.forEach((c,i)=>{
    if(!(c.text||"").trim()) problems.push(`Причина ${i+1}: не заполнена формулировка.`);
    if(!(c.obj&&c.obj.cat)) problems.push(`Причина ${i+1}: не выбрана категория.`);
    const acts=(S.acts||[]).filter(a=>a.causeId===c.id&&!a.dup&&(a.text||"").trim());
    if(!acts.length&&!c.needStats) problems.push(`Причина ${i+1}: нет мероприятий (или отметьте «копим статистику»).`);
  });
  (S.acts||[]).filter(a=>!a.dup&&(a.text||"").trim()).forEach((a,i)=>{
    if(!(a.who||"").trim()) problems.push(`Мероприятие «${(a.text||"").slice(0,32)}»: не указан исполнитель.`);
    if(!(a.due||"").trim()) problems.push(`Мероприятие «${(a.text||"").slice(0,32)}»: не указан срок.`);
    if(!(a.status||"").trim()) problems.push(`Мероприятие «${(a.text||"").slice(0,32)}»: не выбран статус.`);
  });
  return problems;
}

async function schemePNG(){
  try{
    if(!S.links||!S.links.length) return "";
    const box=document.createElement("div");
    box.innerHTML=schemeSVG();
    const svg=box.querySelector("svg");
    if(!svg) return "";
    const w=parseInt(svg.getAttribute("width"),10)||900;
    const hh=parseInt(svg.getAttribute("height"),10)||400;
    const xml=new XMLSerializer().serializeToString(svg);
    const url="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)));
    const img=new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; setTimeout(rej,4000); });
    const k=2;
    const cv=document.createElement("canvas"); cv.width=w*k; cv.height=hh*k;
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.scale(k,k); ctx.drawImage(img,0,0);
    return cv.toDataURL("image/png");
  }catch(e){ return ""; }
}

  }

  if(S.circs.length){
    h+=rHead("6. Обстоятельства");
    h+=rTable(["Обстоятельство","Влияние компании","Несработавший барьер (владелец)","ВЫВОДЫ"],

        return [esc(c.text),infl,esc(c.barrier)+(c.owner?" ("+esc(displayOwner2(c))+")":""),итог];

  h+=rHead("7. Системные причины");
