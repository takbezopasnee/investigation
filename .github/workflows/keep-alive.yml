# ============================================================
#  «Формула безопасности» — будильник для базы Supabase
#
#  Не даёт базе бесплатного тарифа заснуть от простоя.
#  Раз в 3 дня делает один лёгкий запрос к базе — этого
#  достаточно, чтобы счётчик 7 дней неактивности не дошёл до нуля.
#
#  Куда положить: в репозиторий с приложением, по пути
#    .github/workflows/keep-alive.yml
#  (папки .github и workflows создать, если их нет)
#
#  Перед использованием впишите два значения ниже:
#    SUPABASE_URL  — адрес вашего проекта Supabase
#    SUPABASE_ANON — публичный anon-ключ (тот же, что в index.html)
# ============================================================

name: Keep Supabase Alive

on:
  schedule:
    # минута час день месяц день-недели (по UTC)
    # '0 9 */3 * *' = в 09:00 UTC каждые 3 дня
    - cron: '0 9 */3 * *'
  # позволяет запустить вручную кнопкой в разделе Actions (для проверки)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг базы Supabase
        run: |
          # Значения вашего проекта (публичный anon-ключ, как в index.html):
          SUPABASE_URL="https://mwlogdphkclydurugmky.supabase.co"
          SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13bG9nZHBoa2NseWR1cnVnbWt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MjEyOTAsImV4cCI6MjEwMDE5NzI5MH0.lXyj8cxGkc9uGwZiYRa6DfeB9nLBiChTGE3B_fNZoO0"

          echo "Пингуем базу, чтобы не заснула..."
          # лёгкий запрос к публичной таблице справочника (ref_items).
          # limit=1 — берём одну строку, минимальная нагрузка.
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/ref_items?select=list&limit=1" \
            -H "apikey: $SUPABASE_ANON" \
            -H "Authorization: Bearer $SUPABASE_ANON")

          echo "Ответ базы: HTTP $HTTP_CODE"
          # 200 или 206 — база жива и ответила. Иначе — сигнал проблемы.
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "206" ]; then
            echo "✅ База активна, счётчик простоя сброшен."
          else
            echo "⚠️ Неожиданный ответ ($HTTP_CODE) — проверьте URL и ключ."
            exit 1
          fi
